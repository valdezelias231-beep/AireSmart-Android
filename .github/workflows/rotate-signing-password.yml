name: Rotar contraseña firma AireSmart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest

    env:
      OLD_PASSWORD: ${{ secrets.AIRESMART_SIGNING_PASSWORD }}
      NEW_PASSWORD: ${{ secrets.AIRESMART_SIGNING_PASSWORD_NEW }}
      KEY_ALIAS: airesmart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar secretos
        shell: bash
        run: |
          set -euo pipefail

          test -n "${OLD_PASSWORD:-}"
          test -n "${NEW_PASSWORD:-}"

          if [ "${#NEW_PASSWORD}" -lt 24 ]; then
            echo "La contraseña nueva debe tener al menos 24 caracteres."
            exit 1
          fi

      - name: Descifrar clave actual
        shell: bash
        run: |
          set -euo pipefail

          openssl enc -d \
            -aes-256-cbc \
            -pbkdf2 \
            -iter 250000 \
            -in .github/signing/airesmart-release.jks.enc \
            -out /tmp/airesmart-release.jks \
            -pass env:OLD_PASSWORD

          test -s /tmp/airesmart-release.jks

      - name: Guardar huella original
        shell: bash
        run: |
          set -euo pipefail

          keytool -exportcert \
            -rfc \
            -alias "$KEY_ALIAS" \
            -keystore /tmp/airesmart-release.jks \
            -storepass "$OLD_PASSWORD" \
            > /tmp/cert-before.pem

          openssl x509 \
            -in /tmp/cert-before.pem \
            -noout \
            -fingerprint \
            -sha256 \
            > /tmp/fingerprint-before.txt

          cat /tmp/fingerprint-before.txt

      - name: Detectar tipo de almacén
        shell: bash
        run: |
          set -euo pipefail

          TYPE="$(
            keytool -list \
              -keystore /tmp/airesmart-release.jks \
              -storepass "$OLD_PASSWORD" 2>/dev/null |
            sed -n 's/^Keystore type: //p'
          )"

          echo "STORE_TYPE=$TYPE" >> "$GITHUB_ENV"
          echo "Tipo detectado: $TYPE"

      - name: Cambiar contraseña interna
        shell: bash
        run: |
          set -euo pipefail

          if [ "${STORE_TYPE^^}" = "JKS" ]; then

            keytool -keypasswd \
              -alias "$KEY_ALIAS" \
              -keystore /tmp/airesmart-release.jks \
              -storepass "$OLD_PASSWORD" \
              -keypass "$OLD_PASSWORD" \
              -new "$NEW_PASSWORD"

          fi

          keytool -storepasswd \
            -keystore /tmp/airesmart-release.jks \
            -storepass "$OLD_PASSWORD" \
            -new "$NEW_PASSWORD"

      - name: Verificar clave con contraseña nueva
        shell: bash
        run: |
          set -euo pipefail

          echo "AireSmart signing verification" > /tmp/test.txt
          jar --create --file /tmp/test.jar -C /tmp test.txt

          jarsigner \
            -keystore /tmp/airesmart-release.jks \
            -storepass "$NEW_PASSWORD" \
            -keypass "$NEW_PASSWORD" \
            /tmp/test.jar \
            "$KEY_ALIAS"

          jarsigner -verify /tmp/test.jar

      - name: Confirmar misma firma
        shell: bash
        run: |
          set -euo pipefail

          keytool -exportcert \
            -rfc \
            -alias "$KEY_ALIAS" \
            -keystore /tmp/airesmart-release.jks \
            -storepass "$NEW_PASSWORD" \
            > /tmp/cert-after.pem

          openssl x509 \
            -in /tmp/cert-after.pem \
            -noout \
            -fingerprint \
            -sha256 \
            > /tmp/fingerprint-after.txt

          diff /tmp/fingerprint-before.txt /tmp/fingerprint-after.txt

          echo "La firma de AireSmart sigue siendo exactamente la misma."

      - name: Cifrar con contraseña nueva
        shell: bash
        run: |
          set -euo pipefail

          openssl enc \
            -aes-256-cbc \
            -salt \
            -pbkdf2 \
            -iter 250000 \
            -in /tmp/airesmart-release.jks \
            -out /tmp/airesmart-release.jks.enc \
            -pass env:NEW_PASSWORD

          test -s /tmp/airesmart-release.jks.enc

      - name: Subir clave cifrada recuperada
        uses: actions/upload-artifact@v4
        with:
          name: AireSmart-Signing-Key-Rotated
          path: /tmp/airesmart-release.jks.enc
          retention-days: 1

      - name: Borrar archivos temporales
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/airesmart-release.jks \
            /tmp/cert-before.pem \
            /tmp/cert-after.pem \
            /tmp/fingerprint-before.txt \
            /tmp/fingerprint-after.txt \
            /tmp/test.txt \
            /tmp/test.jar
