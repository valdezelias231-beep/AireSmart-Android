                          updateButton.setAlpha(1f);
                          updateButton.setText("REINTENTAR");
                      }

                      if (updateDetail != null) {
                          updateDetail.setText(message);
                          updateDetail.setTextColor(
                              Color.rgb(201,54,64)
                          );
                      }
                  });
              }

