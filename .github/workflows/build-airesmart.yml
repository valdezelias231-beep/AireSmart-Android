              }

              private SecretKey getOrCreateMqttSecretKey()
                  throws Exception {

                  KeyStore keyStore = KeyStore.getInstance(KEYSTORE_PROVIDER);
                  keyStore.load(null);

                  if (keyStore.containsAlias(MQTT_KEY_ALIAS)) {
                      KeyStore.SecretKeyEntry entry =
                          (KeyStore.SecretKeyEntry) keyStore.getEntry(
                              MQTT_KEY_ALIAS,
                              null
                          );

                      return entry.getSecretKey();
                  }

                  KeyGenerator generator = KeyGenerator.getInstance(
                      KeyProperties.KEY_ALGORITHM_AES,
                      KEYSTORE_PROVIDER
                  );

                  generator.init(
                      new KeyGenParameterSpec.Builder(
                          MQTT_KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT |
                              KeyProperties.PURPOSE_DECRYPT
                      )
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(
                              KeyProperties.ENCRYPTION_PADDING_NONE
                          )
                          .setRandomizedEncryptionRequired(true)
                          .build()
                  );

                  return generator.generateKey();
              }

              private void saveMqttPasswordSecure(String value)
                  throws Exception {

                  SecretKey key = getOrCreateMqttSecretKey();

                  Cipher cipher = Cipher.getInstance(
                      "AES/GCM/NoPadding"
                  );

                  cipher.init(Cipher.ENCRYPT_MODE, key);

                  byte[] encrypted = cipher.doFinal(
                      value.getBytes(StandardCharsets.UTF_8)
                  );

                  String packed =
                      Base64.encodeToString(
                          cipher.getIV(),
                          Base64.NO_WRAP
                      ) +
                      "." +
                      Base64.encodeToString(
                          encrypted,
                          Base64.NO_WRAP
                      );

                  prefs.edit()
                      .putString(PREF_MQTT_PASSWORD_SECURE, packed)
                      .remove("password")
                      .apply();

                  password = value;
              }

              private String loadMqttPasswordSecure() {
                  String packed = prefs.getString(
                      PREF_MQTT_PASSWORD_SECURE,
                      ""
                  );

                  if (packed.isEmpty()) {
                      return "";
                  }

                  try {
                      int separator = packed.indexOf('.');

                      if (
                          separator <= 0 ||
                          separator >= packed.length() - 1
                      ) {
                          return "";
                      }

                      String ivText = packed.substring(0, separator);
                      String encryptedText =
                          packed.substring(separator + 1);

                      byte[] iv = Base64.decode(
                          ivText,
                          Base64.NO_WRAP
                      );

                      byte[] encrypted = Base64.decode(
                          encryptedText,
                          Base64.NO_WRAP
                      );

                      SecretKey key = getOrCreateMqttSecretKey();

                      Cipher cipher = Cipher.getInstance(
                          "AES/GCM/NoPadding"
                      );

                      cipher.init(
                          Cipher.DECRYPT_MODE,
                          key,
                          new GCMParameterSpec(128, iv)
                      );

                      byte[] clear = cipher.doFinal(encrypted);

                      return new String(
                          clear,
                          StandardCharsets.UTF_8
                      );

                  } catch (Exception error) {
                      return "";
                  }
              }

