name: Build AireSmart APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-airesmart.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      AIRESMART_SIGNING_PASSWORD: ${{ secrets.AIRESMART_SIGNING_PASSWORD }}
      AIRESMART_KEY_ALIAS: airesmart

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify permanent signing setup
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${AIRESMART_SIGNING_PASSWORD:-}" ]; then
            echo "ERROR: AIRESMART_SIGNING_PASSWORD is not configured."
            exit 1
          fi

          if [ ! -s ".github/signing/airesmart-release.jks.enc" ]; then
            echo "ERROR: Permanent encrypted signing key is missing."
            exit 1
          fi

      - name: Decrypt permanent AireSmart signing key
        shell: bash
        run: |
          set -euo pipefail

          openssl enc             -d             -aes-256-cbc             -pbkdf2             -iter 250000             -in .github/signing/airesmart-release.jks.enc             -out /tmp/airesmart-release.jks             -pass env:AIRESMART_SIGNING_PASSWORD

          test -s /tmp/airesmart-release.jks

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/airesmart/remote
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AireSmartRemote"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.airesmart.remote'
              compileSdk 35

              defaultConfig {
                  applicationId "com.airesmart.remote"
                  minSdk 23
                  targetSdk 35
                  versionCode 26
                  versionName "1.0.25"
              }

              signingConfigs {
                  release {
                      storeFile file("/tmp/airesmart-release.jks")
                      storePassword System.getenv("AIRESMART_SIGNING_PASSWORD")
                      keyAlias System.getenv("AIRESMART_KEY_ALIAS")
                      keyPassword System.getenv("AIRESMART_SIGNING_PASSWORD")
                  }
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ""
                      versionNameSuffix ""
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              buildFeatures {
                  buildConfig true
              }
          }

          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          # AireSmart launcher icon only
          cat > /tmp/airesmart_icon.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/airesmart_icon.b64 > app/src/main/res/drawable/airesmart_app_icon.png
          rm -f /tmp/airesmart_icon.b64

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#E4E9EF</item>
                  <item name="android:navigationBarColor">#E4E9EF</item>
                  <item name="android:colorAccent">#2F8CFF</item>
                  <item name="android:windowBackground">#E9EDF2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <application
                  android:allowBackup="false"
                  android:label="AireSmart"
                  android:icon="@drawable/airesmart_app_icon"
                  android:roundIcon="@drawable/airesmart_app_icon"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/airesmart/remote/MainActivity.java <<'EOF'
