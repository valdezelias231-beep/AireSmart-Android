name: Build AireSmart APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-airesmart.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/airesmart/remote
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AireSmartRemote"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.airesmart.remote'
              compileSdk 35

              defaultConfig {
                  applicationId "com.airesmart.remote"
                  minSdk 23
                  targetSdk 35
                  versionCode 9
                  versionName "1.0.8"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ""
                      versionNameSuffix ""
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#E4E9EF</item>
                  <item name="android:navigationBarColor">#E4E9EF</item>
                  <item name="android:colorAccent">#2F8CFF</item>
                  <item name="android:windowBackground">#E9EDF2</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="false"
                  android:label="AireSmart"
                  android:usesCleartextTraffic="false"
                  android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/airesmart/remote/MainActivity.java <<'EOF'
          package com.airesmart.remote;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.animation.ValueAnimator;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.HapticFeedbackConstants;
          import android.view.MotionEvent;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.view.animation.LinearInterpolator;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.eclipse.paho.client.mqttv3.IMqttDeliveryToken;
          import org.eclipse.paho.client.mqttv3.MqttCallbackExtended;
          import org.eclipse.paho.client.mqttv3.MqttClient;
          import org.eclipse.paho.client.mqttv3.MqttConnectOptions;
          import org.eclipse.paho.client.mqttv3.MqttMessage;
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence;
          import org.json.JSONObject;

          import java.nio.charset.StandardCharsets;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private MqttClient mqtt;
              private SharedPreferences prefs;

              private TextView cloudStatus, detailState, systemState, heroSub, ackState;
              private Button lowButton, highButton;
              private PowerRingView powerRing;

              private String host = "x10cd1d1.ala.us-east-1.emqxsl.com";
              private int port = 8883;
              private String username = "airesmart_remote_001";
              private String password = "";
              private String topicBase = "airesmart/001";

              private boolean motorOn = false;
              private boolean high = false;
              private boolean systemActive = false;
              private String pendingId = null;

              private final Runnable ackTimeout = () -> {
                  if (pendingId != null) {
                      showAck("SIN CONFIRMACIÓN · revisa conexión", false);
                      pendingId = null;
                      restoreRing();
                  }
              };

              private final Runnable clearAck = () -> {
                  ackState.animate()
                      .alpha(0f)
                      .setDuration(180)
                      .withEndAction(() -> {
                          ackState.setText("LISTO");
                          ackState.animate().alpha(1f).setDuration(220).start();
                      })
                      .start();
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("airesmart", MODE_PRIVATE);
                  host = prefs.getString("host", host);
                  port = prefs.getInt("port", port);
                  username = prefs.getString("username", username);
                  password = prefs.getString("password", "");
                  topicBase = prefs.getString("topicBase", topicBase);

                  setContentView(buildUi());

                  if (password.isEmpty()) {
                      showConnectionDialog();
                  } else {
                      connectMqtt();
                  }
              }

              private View buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(228, 233, 239));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(20), dp(18), dp(28));
                  scroll.addView(root, new ScrollView.LayoutParams(-1, -1));

                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);

                  LinearLayout brand = new LinearLayout(this);
                  brand.setOrientation(LinearLayout.VERTICAL);

                  TextView title = text("AireSmart", 29, Color.rgb(16,35,62), true);
                  title.setGravity(Gravity.START);
                  title.setOnLongClickListener(v -> {
                      showConnectionDialog();
                      return true;
                  });
                  brand.addView(title);

                  TextView sub = text("Control inteligente", 13, Color.rgb(113,132,155), false);
                  sub.setGravity(Gravity.START);
                  brand.addView(sub);

                  header.addView(brand, new LinearLayout.LayoutParams(0, -2, 1));

                  LinearLayout conn = new LinearLayout(this);
                  conn.setOrientation(LinearLayout.VERTICAL);
                  conn.setGravity(Gravity.CENTER);
                  conn.setPadding(dp(14), dp(9), dp(14), dp(9));
                  conn.setBackground(bg(Color.rgb(237,241,244), 18));

                  cloudStatus = text("● DESCONECTADO", 12, Color.rgb(201,54,64), true);
                  detailState = text("Sin conexión", 10, Color.rgb(124,142,163), false);
                  conn.addView(cloudStatus);
                  conn.addView(detailState);

                  header.addView(conn);
                  root.addView(header);
                  space(root, 18);

                  LinearLayout hero = card();
                  hero.setGravity(Gravity.CENTER_HORIZONTAL);
                  hero.setPadding(dp(18), dp(18), dp(18), dp(20));

                  powerRing = new PowerRingView(this);
                  powerRing.setMode(PowerRingView.MODE_SYNC);
                  powerRing.setOnClickListener(v -> sendPower(!systemActive));
                  addPressEffect(powerRing);
                  hero.addView(powerRing, new LinearLayout.LayoutParams(dp(248), dp(248)));

                  systemState = text("SINCRONIZANDO…", 25, Color.rgb(92,112,136), true);
                  hero.addView(systemState);

                  heroSub = text("Esperando estado del AireSmart", 13, Color.rgb(113,132,155), false);
                  heroSub.setGravity(Gravity.CENTER);
                  hero.addView(heroSub);

                  root.addView(hero);
                  space(root, 14);

                  LinearLayout speedCard = card();
                  TextView speedTitle = text("VELOCIDAD", 11, Color.rgb(92,112,136), true);
                  speedTitle.setGravity(Gravity.START);
                  speedCard.addView(speedTitle);
                  space(speedCard, 10);

                  LinearLayout speeds = new LinearLayout(this);
                  speeds.setOrientation(LinearLayout.HORIZONTAL);

                  lowButton = button("BAJA", Color.rgb(58,101,173));
                  highButton = button("ALTA", Color.rgb(240,139,42));

                  lowButton.setOnClickListener(v -> sendSpeed(false));
                  highButton.setOnClickListener(v -> sendSpeed(true));
                  addPressEffect(lowButton);
                  addPressEffect(highButton);

                  speeds.addView(lowButton, new LinearLayout.LayoutParams(0, dp(54), 1));
                  spaceHorizontal(speeds, 10);
                  speeds.addView(highButton, new LinearLayout.LayoutParams(0, dp(54), 1));

                  speedCard.addView(speeds);
                  root.addView(speedCard);
                  space(root, 12);

                  ackState = text("LISTO", 12, Color.rgb(99,119,143), false);
                  LinearLayout ackCard = new LinearLayout(this);
                  ackCard.setGravity(Gravity.CENTER);
                  ackCard.setPadding(dp(14), dp(12), dp(14), dp(12));
                  ackCard.setBackground(bg(Color.rgb(237,241,244), 16));
                  ackCard.addView(ackState);
                  root.addView(ackCard);

                  TextView version = text("AireSmart Remote v1.0.8", 10, Color.rgb(132,148,167), false);
                  LinearLayout.LayoutParams vp = lp(-1, -2);
                  vp.topMargin = dp(20);
                  root.addView(version, vp);

                  animateEntrance(root);
                  return scroll;
              }

              private void showConnectionDialog() {
                  LinearLayout form = new LinearLayout(this);
                  form.setOrientation(LinearLayout.VERTICAL);
                  form.setPadding(dp(18), 0, dp(18), 0);

                  EditText hostEt = field("Broker", host, false);
                  EditText portEt = field("Puerto", String.valueOf(port), false);
                  portEt.setInputType(InputType.TYPE_CLASS_NUMBER);
                  EditText userEt = field("Usuario", username, false);
                  EditText passEt = field("Contraseña MQTT", password, true);
                  EditText topicEt = field("Topic base", topicBase, false);

                  form.addView(hostEt);
                  form.addView(portEt);
                  form.addView(userEt);
                  form.addView(passEt);
                  form.addView(topicEt);

                  new AlertDialog.Builder(this)
                      .setTitle("Configuración AireSmart")
                      .setMessage("Acceso de administrador")
                      .setView(form)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("CONECTAR", (d, w) -> {
                          host = hostEt.getText().toString().trim();
                          try {
                              port = Integer.parseInt(portEt.getText().toString().trim());
                          } catch (Exception e) {
                              port = 8883;
                          }
                          username = userEt.getText().toString().trim();
                          password = passEt.getText().toString();
                          topicBase = topicEt.getText().toString().trim();

                          if (password.isEmpty()) {
                              toast("Falta la contraseña MQTT");
                              return;
                          }

                          prefs.edit()
                              .putString("host", host)
                              .putInt("port", port)
                              .putString("username", username)
                              .putString("password", password)
                              .putString("topicBase", topicBase)
                              .apply();

                          connectMqtt();
                      }).show();
              }

              private void connectMqtt() {
                  setCloud("● CONECTANDO", Color.rgb(240,161,30), "Sincronizando…");
                  systemState.setText("SINCRONIZANDO…");
                  systemState.setTextColor(Color.rgb(92,112,136));
                  heroSub.setText("Esperando estado del AireSmart");
                  powerRing.setMode(PowerRingView.MODE_SYNC);

                  io.execute(() -> {
                      try {
                          if (mqtt != null) {
                              try {
                                  if (mqtt.isConnected()) mqtt.disconnect();
                              } catch (Exception ignored) {}
                              try {
                                  mqtt.close();
                              } catch (Exception ignored) {}
                          }

                          String uri = "ssl://" + host + ":" + port;
                          mqtt = new MqttClient(
                              uri,
                              "airesmart_app_" + UUID.randomUUID().toString().substring(0,8),
                              new MemoryPersistence()
                          );

                          mqtt.setCallback(new MqttCallbackExtended() {
                              @Override
                              public void connectComplete(boolean reconnect, String serverURI) {
                                  runOnUiThread(() ->
                                      setCloud(
                                          "● BROKER",
                                          Color.rgb(13,136,74),
                                          reconnect ? "Reconectado" : "Conectado"
                                      )
                                  );
                                  subscribeTopics();
                              }

                              @Override
                              public void connectionLost(Throwable cause) {
                                  runOnUiThread(() -> {
                                      setCloud("● OFFLINE", Color.rgb(201,54,64), "Conexión perdida");
                                      powerRing.setMode(PowerRingView.MODE_OFFLINE);
                                  });
                              }

                              @Override
                              public void messageArrived(String topic, MqttMessage message) {
                                  handleMessage(
                                      topic,
                                      new String(message.getPayload(), StandardCharsets.UTF_8)
                                  );
                              }

                              @Override
                              public void deliveryComplete(IMqttDeliveryToken token) {}
                          });

                          MqttConnectOptions o = new MqttConnectOptions();
                          o.setUserName(username);
                          o.setPassword(password.toCharArray());
                          o.setAutomaticReconnect(true);
                          o.setCleanSession(true);
                          o.setConnectionTimeout(12);
                          o.setKeepAliveInterval(45);
                          mqtt.connect(o);

                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              setCloud("● ERROR", Color.rgb(201,54,64), safe(e.getMessage()));
                              powerRing.setMode(PowerRingView.MODE_OFFLINE);
                          });
                      }
                  });
              }

              private void subscribeTopics() {
                  io.execute(() -> {
                      try {
                          mqtt.subscribe(topicBase + "/state", 1);
                          mqtt.subscribe(topicBase + "/ack", 1);
                          mqtt.subscribe(topicBase + "/status", 1);
                      } catch (Exception e) {
                          runOnUiThread(() ->
                              setCloud(
                                  "● ERROR",
                                  Color.rgb(201,54,64),
                                  "Suscripción MQTT"
                              )
                          );
                      }
                  });
              }

              private void handleMessage(String topic, String payload) {
                  try {
                      JSONObject j = new JSONObject(payload);

                      if (topic.endsWith("/state")) {
                          motorOn = j.optBoolean("motor", false);
                          high = j.optBoolean("high", false);
                          String state = j.optString(
                              "state",
                              motorOn ? "ENCENDIDO" : "APAGADO"
                          );
                          long soak = j.optLong("soakRemaining", 0);

                          runOnUiThread(() -> {
                              setCloud(
                                  "● EN LÍNEA",
                                  Color.rgb(13,136,74),
                                  "Estado sincronizado"
                              );
                              paintState(state, soak);
                          });

                      } else if (topic.endsWith("/status")) {
                          boolean online = j.optBoolean("online", false);
                          runOnUiThread(() -> {
                              setCloud(
                                  online ? "● EN LÍNEA" : "● OFFLINE",
                                  online ? Color.rgb(13,136,74) : Color.rgb(201,54,64),
                                  online ? "AireSmart conectado" : "AireSmart sin conexión"
                              );
                              if (!online) powerRing.setMode(PowerRingView.MODE_OFFLINE);
                          });

                      } else if (topic.endsWith("/ack")) {
                          String id = j.optString("id", "");
                          if (pendingId != null && !pendingId.equals(id)) return;

                          mainHandler.removeCallbacks(ackTimeout);
                          pendingId = null;

                          boolean accepted = j.optBoolean("accepted", false);
                          String result = j.optString(
                              "result",
                              accepted ? "accepted" : "rejected"
                          );

                          motorOn = j.optBoolean("motor", motorOn);
                          high = j.optBoolean("high", high);
                          String state = j.optString(
                              "state",
                              motorOn ? "ENCENDIDO" : "APAGADO"
                          );

                          runOnUiThread(() -> {
                              showAck(
                                  accepted
                                      ? "ORDEN CONFIRMADA"
                                      : "ORDEN RECHAZADA · " + friendlyResult(result),
                                  accepted
                              );
                              paintState(state, 0);
                          });
                      }

                  } catch (Exception e) {
                      runOnUiThread(() -> showAck("MENSAJE MQTT NO VÁLIDO", false));
                  }
              }

              private void sendPower(boolean on) {
                  sendCommand("power", on ? "true" : "false", true);
              }

              private void sendSpeed(boolean makeHigh) {
                  sendCommand("speed", makeHigh ? "high" : "low", false);
              }

              private void sendCommand(String action, String value, boolean boolValue) {
                  if (mqtt == null || !mqtt.isConnected()) {
                      toast("AireSmart no está conectado");
                      return;
                  }

                  String id =
                      System.currentTimeMillis() + "-" +
                      UUID.randomUUID().toString().substring(0,6);

                  String json = boolValue
                      ? "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":"+value+"}"
                      : "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":\""+value+"\"}";

                  pendingId = id;
                  showAck("ENVIANDO ORDEN…", false);
                  powerRing.setMode(PowerRingView.MODE_PENDING);

                  mainHandler.removeCallbacks(ackTimeout);
                  mainHandler.postDelayed(ackTimeout, 8000);

                  io.execute(() -> {
                      try {
                          MqttMessage m =
                              new MqttMessage(json.getBytes(StandardCharsets.UTF_8));
                          m.setQos(1);
                          m.setRetained(false);
                          mqtt.publish(topicBase + "/cmd", m);

                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              mainHandler.removeCallbacks(ackTimeout);
                              pendingId = null;
                              showAck(
                                  "ERROR AL ENVIAR · " + safe(e.getMessage()),
                                  false
                              );
                              restoreRing();
                          });
                      }
                  });
              }

              private void paintState(String state, long soak) {
                  String upper = state == null ? "--" : state.toUpperCase();

                  systemActive = soak > 0 || !upper.contains("APAGADO");

                  if (soak > 0 || upper.contains("REMOJ")) {
                      setStateLabel("REMOJANDO", Color.rgb(13,125,246));
                      hideHeroSub();
                      powerRing.setMode(PowerRingView.MODE_SOAK);
                      powerRing.setSoakRemaining(Math.max(0L, soak));

                  } else if (motorOn || upper.contains("ENCENDIDO")) {
                      setStateLabel(
                          high ? "ENCENDIDO · ALTA" : "ENCENDIDO · BAJA",
                          Color.rgb(7,136,74)
                      );
                      showHeroSub("Funcionamiento normal");
                      systemActive = true;
                      powerRing.setMode(PowerRingView.MODE_ON);

                  } else {
                      setStateLabel("APAGADO", Color.rgb(201,54,64));
                      showHeroSub("Equipo en espera");
                      systemActive = false;
                      powerRing.setMode(PowerRingView.MODE_OFF);
                  }

                  paintSpeedButtons();
              }

              private void setStateLabel(String label, int color) {
                  String current = systemState.getText() == null
                      ? ""
                      : systemState.getText().toString();

                  if (current.equals(label)) {
                      systemState.setTextColor(color);
                      return;
                  }

                  systemState.animate().cancel();
                  systemState.animate()
                      .alpha(0f)
                      .translationY(-dp(5))
                      .setDuration(110)
                      .withEndAction(() -> {
                          systemState.setText(label);
                          systemState.setTextColor(color);
                          systemState.setTranslationY(dp(5));
                          systemState.animate()
                              .alpha(1f)
                              .translationY(0f)
                              .setDuration(210)
                              .setInterpolator(new AccelerateDecelerateInterpolator())
                              .start();
                      })
                      .start();
              }

              private void hideHeroSub() {
                  if (heroSub.getVisibility() == View.GONE) return;

                  heroSub.animate().cancel();
                  heroSub.animate()
                      .alpha(0f)
                      .setDuration(130)
                      .withEndAction(() -> heroSub.setVisibility(View.GONE))
                      .start();
              }

              private void showHeroSub(String text) {
                  boolean wasHidden = heroSub.getVisibility() != View.VISIBLE;
                  boolean changed = heroSub.getText() == null ||
                      !heroSub.getText().toString().equals(text);

                  if (!wasHidden && !changed) return;

                  heroSub.animate().cancel();
                  heroSub.setText(text);
                  heroSub.setVisibility(View.VISIBLE);
                  heroSub.setAlpha(0f);
                  heroSub.setTranslationY(dp(4));
                  heroSub.animate()
                      .alpha(1f)
                      .translationY(0f)
                      .setDuration(220)
                      .setInterpolator(new AccelerateDecelerateInterpolator())
                      .start();
              }

              private void restoreRing() {
                  if (!systemActive) {
                      powerRing.setMode(PowerRingView.MODE_OFF);
                  } else if (!motorOn) {
                      powerRing.setMode(PowerRingView.MODE_SOAK);
                  } else {
                      powerRing.setMode(PowerRingView.MODE_ON);
                  }
              }

              private void paintSpeedButtons() {
                  boolean ready = motorOn;

                  lowButton.setEnabled(ready);
                  highButton.setEnabled(ready);

                  if (!ready) {
                      lowButton.setAlpha(0.45f);
                      highButton.setAlpha(0.45f);
                      return;
                  }

                  lowButton.setAlpha(1f);
                  highButton.setAlpha(1f);

                  if (high) {
                      lowButton.setBackground(bg(Color.rgb(220,226,233), 14));
                      lowButton.setTextColor(Color.rgb(92,112,136));
                      highButton.setBackground(bg(Color.rgb(240,139,42), 14));
                      highButton.setTextColor(Color.WHITE);
                      popSelected(highButton);
                  } else {
                      lowButton.setBackground(bg(Color.rgb(13,125,246), 14));
                      lowButton.setTextColor(Color.WHITE);
                      highButton.setBackground(bg(Color.rgb(220,226,233), 14));
                      highButton.setTextColor(Color.rgb(92,112,136));
                      popSelected(lowButton);
                  }
              }

              private void showAck(String message, boolean success) {
                  mainHandler.removeCallbacks(clearAck);
                  ackState.animate().cancel();
                  ackState.animate()
                      .alpha(0f)
                      .setDuration(130)
                      .withEndAction(() -> {
                          ackState.setText(message);
                          ackState.setTextColor(
                              success
                                  ? Color.rgb(13,136,74)
                                  : Color.rgb(99,119,143)
                          );
                          ackState.animate().alpha(1f).setDuration(210).start();

                          if (success && powerRing != null) {
                              powerRing.performHapticFeedback(
                                  HapticFeedbackConstants.CONFIRM
                              );
                              powerRing.flashSuccess();
                          }

                          if (!message.startsWith("ENVIANDO")) {
                              mainHandler.postDelayed(clearAck, 2600);
                          }
                      })
                      .start();
              }

              private void addPressEffect(View v) {
                  v.setOnTouchListener((view, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          view.animate()
                              .scaleX(0.965f)
                              .scaleY(0.965f)
                              .setDuration(90)
                              .start();
                      } else if (
                          event.getAction() == MotionEvent.ACTION_UP ||
                          event.getAction() == MotionEvent.ACTION_CANCEL
                      ) {
                          view.animate()
                              .scaleX(1f)
                              .scaleY(1f)
                              .setDuration(180)
                              .setInterpolator(new AccelerateDecelerateInterpolator())
                              .start();
                      }
                      return false;
                  });
              }

              private void popSelected(View v) {
                  v.animate().cancel();
                  v.setScaleX(0.985f);
                  v.setScaleY(0.985f);
                  v.animate()
                      .scaleX(1.015f)
                      .scaleY(1.015f)
                      .setDuration(140)
                      .withEndAction(() ->
                          v.animate()
                              .scaleX(1f)
                              .scaleY(1f)
                              .setDuration(170)
                              .start()
                      )
                      .start();
              }

              private void animateEntrance(LinearLayout root) {
                  root.post(() -> {
                      int count = root.getChildCount();
                      for (int i = 0; i < count; i++) {
                          View child = root.getChildAt(i);
                          child.setAlpha(0f);
                          child.setTranslationY(dp(12));
                          child.animate()
                              .alpha(1f)
                              .translationY(0f)
                              .setStartDelay(i * 45L)
                              .setDuration(320)
                              .setInterpolator(new AccelerateDecelerateInterpolator())
                              .start();
                      }
                  });
              }

              private String friendlyResult(String result) {
                  if ("already_on_or_starting".equals(result)) return "ya estaba encendido";
                  if ("already_off".equals(result)) return "ya estaba apagado";
                  if ("already_low".equals(result)) return "ya estaba en baja";
                  if ("already_high".equals(result)) return "ya estaba en alta";
                  if ("not_ready".equals(result)) return "espera a que termine el remojo";
                  if ("duplicate_ignored".equals(result)) return "orden duplicada";
                  return result == null || result.isEmpty()
                      ? "sin detalle"
                      : result;
              }

              private void setCloud(String txt, int color, String detail) {
                  cloudStatus.setText(txt);
                  cloudStatus.setTextColor(color);
                  detailState.setText(detail);
              }

              private String safe(String s) {
                  return s == null ? "sin detalle" : s;
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(sp);
                  v.setTextColor(color);
                  v.setGravity(Gravity.CENTER_HORIZONTAL);
                  if (bold) {
                      v.setTypeface(v.getTypeface(), Typeface.BOLD);
                  }
                  return v;
              }

              private LinearLayout card() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(18), dp(18), dp(18), dp(18));
                  l.setBackground(bg(Color.rgb(245,246,248), 22));
                  l.setElevation(dp(2));
                  return l;
              }

              private Button button(String s, int color) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setTypeface(b.getTypeface(), Typeface.BOLD);
                  b.setBackground(bg(color, 14));
                  b.setAllCaps(false);
                  return b;
              }

              private EditText field(String hint, String value, boolean secret) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setText(value);
                  e.setSingleLine(true);
                  e.setTextSize(15);

                  if (secret) {
                      e.setInputType(
                          InputType.TYPE_CLASS_TEXT |
                          InputType.TYPE_TEXT_VARIATION_PASSWORD
                      );
                  }

                  LinearLayout.LayoutParams p = lp(-1, 54);
                  p.bottomMargin = dp(6);
                  e.setLayoutParams(p);
                  return e;
              }

              private GradientDrawable bg(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              private void space(LinearLayout l, int h) {
                  View v = new View(this);
                  l.addView(v, new LinearLayout.LayoutParams(1, dp(h)));
              }

              private void spaceHorizontal(LinearLayout l, int w) {
                  View v = new View(this);
                  l.addView(v, new LinearLayout.LayoutParams(dp(w), 1));
              }

              private LinearLayout.LayoutParams lp(int w, int h) {
                  return new LinearLayout.LayoutParams(
                      w,
                      h < 0 ? h : dp(h)
                  );
              }

              private int dp(int v) {
                  return Math.round(
                      v * getResources().getDisplayMetrics().density
                  );
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  io.execute(() -> {
                      try {
                          if (mqtt != null) {
                              if (mqtt.isConnected()) mqtt.disconnect();
                              mqtt.close();
                          }
                      } catch (Exception ignored) {}
                  });
              }

              public static class PowerRingView extends View {
                  public static final int MODE_SYNC = 0;
                  public static final int MODE_OFF = 1;
                  public static final int MODE_SOAK = 2;
                  public static final int MODE_ON = 3;
                  public static final int MODE_PENDING = 4;
                  public static final int MODE_OFFLINE = 5;

                  private final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint liquidHead = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint center = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint icon = new Paint(Paint.ANTI_ALIAS_FLAG);

                  private int mode = MODE_SYNC;
                  private float rotation = 0f;
                  private float pulse = 1f;
                  private float flash = 0f;
                  private float soakProgress = 0.02f;

                  private ValueAnimator rotationAnimator;
                  private ValueAnimator pulseAnimator;
                  private ValueAnimator flashAnimator;
                  private ValueAnimator soakAnimator;

                  public PowerRingView(Context context) {
                      super(context);
                      setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                      setClickable(true);
                      setFocusable(true);

                      track.setStyle(Paint.Style.STROKE);
                      track.setStrokeWidth(dpLocal(12));
                      track.setStrokeCap(Paint.Cap.ROUND);
                      track.setColor(Color.rgb(215,224,232));

                      glow.setStyle(Paint.Style.STROKE);
                      glow.setStrokeCap(Paint.Cap.ROUND);
                      glow.setStrokeWidth(dpLocal(30));

                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeCap(Paint.Cap.ROUND);
                      ring.setStrokeWidth(dpLocal(13));

                      liquidHead.setStyle(Paint.Style.STROKE);
                      liquidHead.setStrokeCap(Paint.Cap.ROUND);
                      liquidHead.setStrokeWidth(dpLocal(13));

                      center.setStyle(Paint.Style.FILL);
                      center.setColor(Color.rgb(248,249,251));

                      icon.setStyle(Paint.Style.STROKE);
                      icon.setStrokeCap(Paint.Cap.ROUND);
                      icon.setStrokeWidth(dpLocal(5));

                      startModeAnimation();
                  }

                  public void setMode(int m) {
                      if (mode == m) return;

                      mode = m;
                      startModeAnimation();

                      animate().cancel();
                      setScaleX(0.975f);
                      setScaleY(0.975f);
                      setAlpha(0.86f);
                      animate()
                          .scaleX(1f)
                          .scaleY(1f)
                          .alpha(1f)
                          .setDuration(330)
                          .setInterpolator(new AccelerateDecelerateInterpolator())
                          .start();

                      invalidate();
                  }

                  public void setSoakRemaining(long remainingSeconds) {
                      if (mode != MODE_SOAK) return;

                      long safeRemaining = Math.max(0L, Math.min(120L, remainingSeconds));
                      float startProgress = 1f - (safeRemaining / 120f);
                      startProgress = Math.max(0.02f, Math.min(1f, startProgress));

                      // Corrige suavemente cualquier diferencia con el estado real recibido
                      // y continúa llenando el aro de manera local y fluida.
                      soakProgress = startProgress;

                      if (soakAnimator != null) soakAnimator.cancel();

                      if (safeRemaining == 0L) {
                          soakProgress = 1f;
                          invalidate();
                          return;
                      }

                      soakAnimator = ValueAnimator.ofFloat(startProgress, 1f);
                      soakAnimator.setDuration(Math.max(450L, safeRemaining * 1000L));
                      soakAnimator.setInterpolator(new LinearInterpolator());
                      soakAnimator.addUpdateListener(a -> {
                          soakProgress = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      soakAnimator.start();
                  }

                  public void flashSuccess() {
                      if (flashAnimator != null) flashAnimator.cancel();
                      flashAnimator = ValueAnimator.ofFloat(0f, 1f, 0f);
                      flashAnimator.setDuration(520);
                      flashAnimator.setInterpolator(new AccelerateDecelerateInterpolator());
                      flashAnimator.addUpdateListener(a -> {
                          flash = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      flashAnimator.start();
                  }

                  private void startModeAnimation() {
                      if (rotationAnimator != null) rotationAnimator.cancel();
                      if (pulseAnimator != null) pulseAnimator.cancel();

                      // El llenado REMOJANDO es progresivo: nunca gira.
                      if (mode != MODE_SOAK && soakAnimator != null) {
                          soakAnimator.cancel();
                      }

                      rotation = 0f;
                      pulse = 1f;

                      if (mode == MODE_SYNC || mode == MODE_PENDING) {
                          rotationAnimator = ValueAnimator.ofFloat(0f, 360f);
                          rotationAnimator.setRepeatCount(ValueAnimator.INFINITE);
                          rotationAnimator.setInterpolator(new LinearInterpolator());
                          rotationAnimator.setDuration(
                              mode == MODE_PENDING ? 820 : 2350
                          );
                          rotationAnimator.addUpdateListener(a -> {
                              rotation = (float) a.getAnimatedValue();
                              invalidate();
                          });
                          rotationAnimator.start();
                      }

                      if (mode == MODE_ON || mode == MODE_SOAK) {
                          pulseAnimator = ValueAnimator.ofFloat(1f, 1.012f);
                          pulseAnimator.setDuration(mode == MODE_ON ? 1700 : 1450);
                          pulseAnimator.setRepeatCount(ValueAnimator.INFINITE);
                          pulseAnimator.setRepeatMode(ValueAnimator.REVERSE);
                          pulseAnimator.setInterpolator(new AccelerateDecelerateInterpolator());
                          pulseAnimator.addUpdateListener(a -> {
                              pulse = (float) a.getAnimatedValue();
                              invalidate();
                          });
                          pulseAnimator.start();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      float w = getWidth();
                      float h = getHeight();
                      float cx = w / 2f;
                      float cy = h / 2f;
                      float radius = Math.min(w, h) * 0.35f;

                      c.save();
                      c.scale(pulse, pulse, cx, cy);

                      int color;
                      switch (mode) {
                          case MODE_OFF:
                              color = Color.rgb(227,77,89);
                              break;
                          case MODE_SOAK:
                              color = Color.rgb(13,125,246);
                              break;
                          case MODE_ON:
                              color = Color.rgb(19,170,104);
                              break;
                          case MODE_PENDING:
                              color = Color.rgb(240,161,30);
                              break;
                          case MODE_OFFLINE:
                              color = Color.rgb(132,148,167);
                              break;
                          default:
                              color = Color.rgb(92,112,136);
                              break;
                      }

                      if (flash > 0f) {
                          int r = Math.min(255, (int)(19 + 80 * flash));
                          int g = Math.min(255, (int)(170 + 70 * flash));
                          int b = Math.min(255, (int)(104 + 80 * flash));
                          color = Color.rgb(r, g, b);
                      }

                      float outer = radius + dpLocal(12);
                      RectF oval = new RectF(
                          cx - outer, cy - outer,
                          cx + outer, cy + outer
                      );

                      c.drawOval(oval, track);

                      float startAngle = -90f;
                      float sweep;

                      if (mode == MODE_SYNC) {
                          sweep = 250f;
                          startAngle += rotation;
                      } else if (mode == MODE_PENDING) {
                          sweep = 285f;
                          startAngle += rotation;
                      } else if (mode == MODE_SOAK) {
                          sweep = Math.max(3f, 360f * soakProgress);
                      } else {
                          sweep = 360f;
                      }

                      int glowAlphaOuter = Math.min(90, 24 + (int)(35 * flash));
                      int glowAlphaInner = Math.min(125, 45 + (int)(45 * flash));

                      // Halo redondo y suave: sin sombra rectangular.
                      glow.setStrokeWidth(dpLocal(34 + 5 * flash));
                      glow.setColor(Color.argb(
                          glowAlphaOuter,
                          Color.red(color),
                          Color.green(color),
                          Color.blue(color)
                      ));
                      c.drawArc(oval, startAngle, sweep, false, glow);

                      glow.setStrokeWidth(dpLocal(22 + 3 * flash));
                      glow.setColor(Color.argb(
                          glowAlphaInner,
                          Color.red(color),
                          Color.green(color),
                          Color.blue(color)
                      ));
                      c.drawArc(oval, startAngle, sweep, false, glow);

                      ring.setColor(color);
                      c.drawArc(oval, startAngle, sweep, false, ring);

                      // Cabeza luminosa del llenado: da sensación de fluido,
                      // pero el aro permanece fijo y solo avanza.
                      if (mode == MODE_SOAK && sweep > 5f && sweep < 359.5f) {
                          float headSweep = Math.min(22f, sweep);
                          float headStart = startAngle + sweep - headSweep;
                          liquidHead.setColor(Color.rgb(54,196,255));
                          liquidHead.setStrokeWidth(dpLocal(13.5f));
                          c.drawArc(oval, headStart, headSweep, false, liquidHead);

                          glow.setStrokeWidth(dpLocal(24));
                          glow.setColor(Color.argb(95, 54,196,255));
                          c.drawArc(oval, headStart, headSweep, false, glow);
                      }

                      center.setShadowLayer(
                          dpLocal(9),
                          0,
                          dpLocal(4),
                          0x25000000
                      );
                      c.drawCircle(cx, cy, radius, center);
                      center.clearShadowLayer();

                      icon.setColor(color);

                      float iconR = radius * 0.34f;
                      RectF p = new RectF(
                          cx - iconR,
                          cy - iconR,
                          cx + iconR,
                          cy + iconR
                      );

                      c.drawArc(p, -44f, 268f, false, icon);
                      c.drawLine(
                          cx,
                          cy - iconR * 1.05f,
                          cx,
                          cy - iconR * 0.05f,
                          icon
                      );

                      c.restore();
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      super.onDetachedFromWindow();
                      animate().cancel();
                      if (rotationAnimator != null) rotationAnimator.cancel();
                      if (pulseAnimator != null) pulseAnimator.cancel();
                      if (flashAnimator != null) flashAnimator.cancel();
                      if (soakAnimator != null) soakAnimator.cancel();
                  }

                  private float dpLocal(float v) {
                      return v * getResources().getDisplayMetrics().density;
                  }
              }
          }
