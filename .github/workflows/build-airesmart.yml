          cat > app/src/main/java/com/airesmart/remote/BlackBoxLogger.java <<'EOF'
          package com.airesmart.remote;

          import android.content.Context;
          import android.content.SharedPreferences;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public final class BlackBoxLogger {
              private static final String PREFS = "airesmart_blackbox";
              private static final String KEY_EVENTS = "events";
              private static final String KEY_CONNECTED = "connected";
              private static final int MAX_EVENTS = 250;

              private BlackBoxLogger() {}

              public static synchronized void setConnected(Context context, boolean connected) {
                  context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putBoolean(KEY_CONNECTED, connected).apply();
              }

              public static synchronized void log(Context context, String type, String level, String title, String detail, long latencyMs) {
                  try {
                      SharedPreferences p = context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      JSONArray old = new JSONArray(p.getString(KEY_EVENTS, "[]"));
                      JSONArray next = new JSONArray();
                      int start = Math.max(0, old.length() - (MAX_EVENTS - 1));
                      for (int i = start; i < old.length(); i++) next.put(old.get(i));
                      JSONObject e = new JSONObject();
                      e.put("ts", System.currentTimeMillis());
                      e.put("type", clean(type));
                      e.put("level", clean(level));
                      e.put("title", clean(title));
                      e.put("detail", clean(detail));
                      e.put("latencyMs", latencyMs);
                      next.put(e);
                      p.edit().putString(KEY_EVENTS, next.toString()).apply();
                  } catch (Exception ignored) {}
              }

              public static synchronized String snapshot(Context context) {
                  try {
                      SharedPreferences p = context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                      JSONArray events = new JSONArray(p.getString(KEY_EVENTS, "[]"));
                      int ack = 0, errors = 0, latencyCount = 0;
                      long latencySum = 0;
                      for (int i = 0; i < events.length(); i++) {
                          JSONObject e = events.optJSONObject(i);
                          if (e == null) continue;
                          if ("ack".equals(e.optString("type")) && "ok".equals(e.optString("level"))) ack++;
                          if ("error".equals(e.optString("level"))) errors++;
                          long ms = e.optLong("latencyMs", -1);
                          if (ms >= 0 && "ack".equals(e.optString("type"))) { latencySum += ms; latencyCount++; }
                      }
                      JSONObject out = new JSONObject();
                      out.put("connected", p.getBoolean(KEY_CONNECTED, false));
                      out.put("ackCount", ack);
                      out.put("errorCount", errors);
                      out.put("avgLatencyMs", latencyCount == 0 ? 0 : Math.round((double)latencySum / latencyCount));
                      out.put("events", events);
                      return out.toString();
                  } catch (Exception e) {
                      return "{\"connected\":false,\"ackCount\":0,\"errorCount\":1,\"avgLatencyMs\":0,\"events\":[]}";
                  }
              }

              public static synchronized String text(Context context) {
                  try {
                      JSONObject snap = new JSONObject(snapshot(context));
                      JSONArray events = snap.optJSONArray("events");
                      StringBuilder b = new StringBuilder("AireSmart Caja Negra\\n");
                      b.append("Conectado: ").append(snap.optBoolean("connected")).append("\\n\\n");
                      if (events != null) for (int i = 0; i < events.length(); i++) {
                          JSONObject e = events.optJSONObject(i); if (e == null) continue;
                          b.append(e.optLong("ts")).append(" | ").append(e.optString("type")).append(" | ")
                           .append(e.optString("title")).append(" | ").append(e.optString("detail"));
                          long ms = e.optLong("latencyMs", -1); if (ms >= 0) b.append(" | ").append(ms).append(" ms");
                          b.append("\\n");
                      }
                      return b.toString();
                  } catch (Exception e) { return "AireSmart Caja Negra"; }
              }

              public static synchronized void clear(Context context) {
                  context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().putString(KEY_EVENTS, "[]").apply();
              }

              private static String clean(String s) {
                  if (s == null) return "";
                  String x = s.replace('\n',' ').replace('\r',' ').trim();
                  if (x.length() > 220) x = x.substring(0, 220);
                  return x;
              }
          }
          EOF

          cat > app/src/main/java/com/airesmart/remote/BlackBoxActivity.java <<'EOF'
          package com.airesmart.remote;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.HapticFeedbackConstants;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;

          public class BlackBoxActivity extends Activity {
              private WebView web;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable refreshLoop = new Runnable() {
                  @Override public void run() { pushSnapshot(); handler.postDelayed(this, 900); }
              };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  web = new WebView(this);
                  web.setBackgroundColor(0xFFE9ECEF);
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(false);
                  web.getSettings().setAllowFileAccess(true);
                  web.getSettings().setAllowContentAccess(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.addJavascriptInterface(new NativeBridge(), "AireSmartNative");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/airesmart/caja_negra.html");
              }

              @Override protected void onResume() { super.onResume(); handler.post(refreshLoop); }
              @Override protected void onPause() { handler.removeCallbacks(refreshLoop); super.onPause(); }
              @Override protected void onDestroy() { handler.removeCallbacksAndMessages(null); if (web != null) web.destroy(); super.onDestroy(); }

              private void pushSnapshot() {
                  if (web == null) return;
                  String json = BlackBoxLogger.snapshot(this);
                  String quoted = JSONObject.quote(json);
                  web.evaluateJavascript("window.AireSmartBridge&&window.AireSmartBridge.refresh(JSON.parse(" + quoted + "))", null);
              }

              private class NativeBridge {
                  @JavascriptInterface public void close() { runOnUiThread(() -> finish()); }
                  @JavascriptInterface public void refreshNow() { runOnUiThread(() -> { pushSnapshot(); haptic(); }); }
                  @JavascriptInterface public void clearHistory() { BlackBoxLogger.clear(BlackBoxActivity.this); runOnUiThread(() -> { pushSnapshot(); Toast.makeText(BlackBoxActivity.this,"Historial borrado",Toast.LENGTH_SHORT).show(); }); }
                  @JavascriptInterface public void copyDiagnostics() {
                      String text = BlackBoxLogger.text(BlackBoxActivity.this);
                      runOnUiThread(() -> {
                          ClipboardManager cm = (ClipboardManager)getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("AireSmart Caja Negra", text));
                          Toast.makeText(BlackBoxActivity.this,"Diagnóstico copiado",Toast.LENGTH_SHORT).show(); haptic();
                      });
                  }
                  @JavascriptInterface public void shareDiagnostics() {
                      String text = BlackBoxLogger.text(BlackBoxActivity.this);
                      runOnUiThread(() -> {
                          Intent i = new Intent(Intent.ACTION_SEND); i.setType("text/plain");
                          i.putExtra(Intent.EXTRA_SUBJECT,"AireSmart Caja Negra"); i.putExtra(Intent.EXTRA_TEXT,text);
                          startActivity(Intent.createChooser(i,"Exportar diagnóstico"));
                      });
                  }
                  @JavascriptInterface public void haptic() { runOnUiThread(BlackBoxActivity.this::haptic); }
              }

              private void haptic() { try { web.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK); } catch (Exception ignored) {} }
          }
