                  // Migración automática desde versiones anteriores:
                  // si había una contraseña MQTT en SharedPreferences,
                  // se mueve al Android Keystore y se elimina el texto plano.
                  String legacyPassword = prefs.getString("password", "");

                  if (!legacyPassword.isEmpty()) {
                      try {
                          saveMqttPasswordSecure(legacyPassword);
                      } catch (Exception ignored) {
                          // Conservamos compatibilidad en memoria si la migración
                          // excepcionalmente falla; no borramos el valor antiguo.
                      }
                  }

                  password = loadMqttPasswordSecure();

                  if (password.isEmpty() && !legacyPassword.isEmpty()) {
                      password = legacyPassword;
                  }

