                      "este teléfono. Se creará una identidad nueva y única " +
                      "sin borrar la configuración del AireSmart.",
                      12,
                      Color.rgb(92,112,136),
                      false
                  );
                  info.setGravity(Gravity.CENTER);
                  form.addView(info);

                  space(form, 14);

                  EditText codeEt = new EditText(this);
                  codeEt.setHint("XXXX-XXXX");
                  codeEt.setSingleLine(true);
                  codeEt.setTextSize(20);
                  codeEt.setGravity(Gravity.CENTER);
                  codeEt.setAllCaps(true);
                  codeEt.setTextColor(Color.rgb(17,17,17));
                  codeEt.setHintTextColor(Color.rgb(156,163,175));
                  codeEt.setPadding(dp(14), 0, dp(14), 0);
                  codeEt.setBackground(bg(Color.WHITE, 14));
                  form.addView(codeEt, lp(-1, 58));

                  space(form, 14);

                  Button repairButton = button(
                      "REPARAR IDENTIDAD",
                      Color.rgb(235,130,38)
                  );
                  form.addView(repairButton, lp(-1, 56));

                  space(form, 12);

                  TextView status = text(
                      "El código es válido una sola vez.",
                      11,
                      Color.rgb(113,132,155),
                      false
                  );
                  status.setGravity(Gravity.CENTER);
                  form.addView(status);

                  AlertDialog dialog = new AlertDialog.Builder(this)
                      .setTitle("Reparación segura")
                      .setView(form)
                      .setNegativeButton("CERRAR", null)
                      .create();

                  repairButton.setOnClickListener(v -> {
                      String code = codeEt.getText().toString().trim();

                      if (code.isEmpty()) {
                          status.setText("Escribe el código de reparación");
