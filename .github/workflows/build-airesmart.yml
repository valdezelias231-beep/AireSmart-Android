              /**
               * Botón nativo que replica el Flush aprobado para ENFRIAR.
               * - Inactivo: gris limpio, sin ninguna línea oscura.
               * - Activo: base azul, mitad superior oscura y burbujas ascendentes.
               * - No altera MQTT, ACK, estados ni tiempos; solo dibuja la apariencia.
               */
              /**
               * MASK1 para ENFRIAR.
               *
               * Replica en Android nativo la sensación del ejemplo CSS:
               * - 0.7 s
               * - 22 pasos discretos
               * - transición orgánica tipo "nature mask"
               * - fondo claro cuando está inactivo
               * - azul AireSmart cuando queda seleccionado
               *
               * No toca MQTT/ACK/estados; únicamente dibuja el botón.
               */
              public static class Mask1CoolButton extends Button {
                  private static final int MASK_STEPS = 22;

                  private final Paint basePaint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint overlayPaint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint labelPaint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint speckPaint =
                      new Paint(Paint.ANTI_ALIAS_FLAG);

                  private final RectF bounds = new RectF();
                  private final Path overlayPath = new Path();

                  private final int idleColor =
                      Color.rgb(220, 226, 233);
                  private final int idleText =
                      Color.rgb(92, 112, 136);
                  private final int activeBlue =
                      Color.rgb(13, 125, 246);

                  private boolean maskActive = false;
                  private int maskFrame = 0;
                  private ValueAnimator maskAnimator;

                  public Mask1CoolButton(Context context) {
                      super(context);

                      setAllCaps(false);
                      setText("");
                      setBackgroundColor(Color.TRANSPARENT);
                      setPadding(0, 0, 0, 0);

                      labelPaint.setTextAlign(Paint.Align.CENTER);
                      labelPaint.setTypeface(Typeface.DEFAULT_BOLD);
                      labelPaint.setTextSize(
                          14f *
                          getResources()
                              .getDisplayMetrics()
                              .scaledDensity
                      );
                  }

                  public void setMaskActive(boolean active) {
                      int target = active ? MASK_STEPS : 0;

                      if (
                          maskActive == active &&
                          maskFrame == target
                      ) {
                          return;
                      }

                      maskActive = active;

                      if (maskAnimator != null) {
                          maskAnimator.cancel();
                      }

                      int distance = Math.abs(target - maskFrame);
                      long duration = Math.max(
                          90L,
                          Math.round(
                              700f *
                              (
                                  distance /
                                  (float) MASK_STEPS
                              )
                          )
                      );

                      maskAnimator = ValueAnimator.ofInt(
                          maskFrame,
                          target
                      );
                      maskAnimator.setDuration(duration);
                      maskAnimator.setInterpolator(
                          new LinearInterpolator()
                      );
                      maskAnimator.addUpdateListener(animator -> {
                          maskFrame =
                              (Integer) animator.getAnimatedValue();
                          invalidate();
                      });
                      maskAnimator.start();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      float w = getWidth();
                      float h = getHeight();

                      if (w <= 0f || h <= 0f) {
                          return;
                      }

                      float radius = dpLocal(14f);
                      bounds.set(0f, 0f, w, h);

                      // El color seleccionado vive debajo de la máscara.
                      basePaint.setStyle(Paint.Style.FILL);
                      basePaint.setColor(activeBlue);
                      canvas.drawRoundRect(
                          bounds,
                          radius,
                          radius,
                          basePaint
                      );

                      float progress =
                          maskFrame /
                          (float) MASK_STEPS;

                      // En el frame 0 el botón queda 100 % limpio/gris.
                      if (maskFrame <= 0) {
                          overlayPaint.setStyle(Paint.Style.FILL);
                          overlayPaint.setColor(idleColor);
                          canvas.drawRoundRect(
                              bounds,
                              radius,
                              radius,
                              overlayPaint
                          );

                      } else if (maskFrame < MASK_STEPS) {
                          int save = canvas.save();

                          Path clip = new Path();
                          clip.addRoundRect(
                              bounds,
                              radius,
                              radius,
                              Path.Direction.CW
                          );
                          canvas.clipPath(clip);

                          drawNatureMaskOverlay(
                              canvas,
                              w,
                              h,
                              progress
                          );

                          canvas.restoreToCount(save);
                      }

                      // Texto cambia suavemente de gris a blanco.
                      labelPaint.setColor(
                          blendColor(
                              idleText,
                              Color.WHITE,
                              progress
                          )
                      );

                      Paint.FontMetrics fm =
                          labelPaint.getFontMetrics();

                      float baseline =
                          (h / 2f) -
                          ((fm.ascent + fm.descent) / 2f);

                      canvas.drawText(
                          "ENFRIAR",
                          w / 2f,
                          baseline,
                          labelPaint
                      );
                  }

                  /**
                   * Capa clara que se "rompe" de izquierda a derecha
                   * en 22 pasos. El borde ondulado + pequeñas islas
                   * reproduce el carácter orgánico de MASK1/nature.
                   */
                  private void drawNatureMaskOverlay(
                      Canvas canvas,
                      float w,
                      float h,
                      float progress
                  ) {
                      float edgeBase = progress * w;

                      overlayPath.reset();

                      if (progress <= 0f) {
                          overlayPath.addRect(
                              0f,
                              0f,
                              w,
                              h,
                              Path.Direction.CW
                          );
                      } else {
                          float stepY =
                              Math.max(
                                  dpLocal(2f),
                                  h / 28f
                              );

                          float firstX =
                              organicEdgeX(
                                  0f,
                                  edgeBase,
                                  w,
                                  h
                              );

                          overlayPath.moveTo(firstX, 0f);
                          overlayPath.lineTo(w, 0f);
                          overlayPath.lineTo(w, h);

                          for (
                              float y = h;
                              y >= 0f;
                              y -= stepY
                          ) {
                              overlayPath.lineTo(
                                  organicEdgeX(
                                      y,
                                      edgeBase,
                                      w,
                                      h
                                  ),
                                  y
                              );
                          }

                          overlayPath.close();
                      }

                      overlayPaint.setStyle(Paint.Style.FILL);
                      overlayPaint.setColor(idleColor);
                      canvas.drawPath(
                          overlayPath,
                          overlayPaint
                      );

                      // Pequeñas "mordidas" azules alrededor del frente
                      // de la máscara para darle el look de sprite nature.
                      speckPaint.setStyle(Paint.Style.FILL);
                      speckPaint.setColor(activeBlue);

                      float[] yPos = {
                          0.18f, 0.34f, 0.52f,
                          0.70f, 0.84f
                      };
                      float[] xOff = {
                          10f, 20f, 8f, 24f, 14f
                      };
                      float[] radii = {
                          3.6f, 2.5f, 4.2f, 3.0f, 2.2f
                      };

                      for (int i = 0; i < yPos.length; i++) {
                          float cy = h * yPos[i];

                          float cx =
                              edgeBase +
                              dpLocal(xOff[i]) +
                              (float) Math.sin(
                                  (maskFrame * 0.55f) +
                                  (i * 1.7f)
                              ) *
                              dpLocal(4f);

                          if (
                              cx > 0f &&
                              cx < w &&
                              progress > 0.04f &&
                              progress < 0.97f
                          ) {
                              canvas.drawCircle(
                                  cx,
                                  cy,
                                  dpLocal(radii[i]),
                                  speckPaint
                              );
                          }
                      }
                  }

                  private float organicEdgeX(
                      float y,
                      float edgeBase,
                      float w,
                      float h
                  ) {
                      float yn =
                          h <= 0f ? 0f : y / h;

                      float wave1 =
                          (float) Math.sin(
                              yn * 12.4f +
                              maskFrame * 0.31f
                          ) *
                          dpLocal(5.6f);

                      float wave2 =
                          (float) Math.sin(
                              yn * 27.0f -
                              maskFrame * 0.17f
                          ) *
                          dpLocal(2.6f);

                      float wave3 =
                          (float) Math.cos(
                              yn * 7.2f +
                              maskFrame * 0.21f
                          ) *
                          dpLocal(1.8f);

                      float x =
                          edgeBase +
                          wave1 +
                          wave2 +
                          wave3;

                      return Math.max(
                          0f,
                          Math.min(w, x)
                      );
                  }

                  private int blendColor(
                      int from,
                      int to,
                      float t
                  ) {
                      t = Math.max(
                          0f,
                          Math.min(1f, t)
                      );

                      int r = Math.round(
                          Color.red(from) +
                          (
                              Color.red(to) -
                              Color.red(from)
                          ) * t
                      );
                      int g = Math.round(
                          Color.green(from) +
                          (
                              Color.green(to) -
                              Color.green(from)
                          ) * t
                      );
                      int b = Math.round(
                          Color.blue(from) +
                          (
                              Color.blue(to) -
                              Color.blue(from)
                          ) * t
                      );

                      return Color.rgb(r, g, b);
                  }

                  private float dpLocal(float value) {
                      return
                          value *
                          getResources()
                              .getDisplayMetrics()
                              .density;
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      super.onDetachedFromWindow();

                      if (maskAnimator != null) {
                          maskAnimator.cancel();
                      }
                  }
              }

              public static class PowerRingView extends View {
                  public static final int MODE_SYNC = 0;
                  public static final int MODE_OFF = 1;
                  public static final int MODE_SOAK = 2;
                  public static final int MODE_ON = 3;
                  public static final int MODE_PENDING = 4;
                  public static final int MODE_OFFLINE = 5;
                  public static final int MODE_FAN = 6;

                  private final Paint track = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint glow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint ring = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint center = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint icon = new Paint(Paint.ANTI_ALIAS_FLAG);

                  private int mode = MODE_SYNC;
                  private float rotation = 0f;
                  private float pulse = 1f;
                  private float flash = 0f;
                  private float soakProgress = 0f;
                  private ValueAnimator rotationAnimator;
                  private ValueAnimator pulseAnimator;
                  private ValueAnimator flashAnimator;
                  private ValueAnimator progressAnimator;

                  public PowerRingView(Context context) {
                      super(context);
                      setLayerType(View.LAYER_TYPE_SOFTWARE, null);
                      setClickable(true);
                      setFocusable(true);

                      track.setStyle(Paint.Style.STROKE);
                      track.setStrokeWidth(dpLocal(12));
                      track.setColor(Color.rgb(215,224,232));

                      glow.setStyle(Paint.Style.STROKE);
                      glow.setStrokeCap(Paint.Cap.ROUND);
                      glow.setStrokeWidth(dpLocal(30));

                      ring.setStyle(Paint.Style.STROKE);
                      ring.setStrokeCap(Paint.Cap.ROUND);
                      ring.setStrokeWidth(dpLocal(13));

                      center.setStyle(Paint.Style.FILL);
                      center.setColor(Color.rgb(248,249,251));

                      icon.setStyle(Paint.Style.STROKE);
                      icon.setStrokeCap(Paint.Cap.ROUND);
                      icon.setStrokeWidth(dpLocal(5));

                      startModeAnimation();
                  }

                  public void setMode(int m) {
                      if (mode == m) return;
                      mode = m;
                      startModeAnimation();
                      invalidate();
                  }

                  public void setSoakRemaining(long remainingSeconds) {
                      if (mode != MODE_SOAK) {
                          mode = MODE_SOAK;
                          startModeAnimation();
                      }

                      long safeRemaining =
                          Math.max(0L, Math.min(120L, remainingSeconds));

                      float targetProgress =
                          1f - (safeRemaining / 120f);

                      targetProgress =
                          Math.max(0.02f, Math.min(1f, targetProgress));

                      if (progressAnimator != null) {
                          progressAnimator.cancel();
                      }

                      // Corrige suavemente a la posición real que reporta
                      // el ESP32 y continúa llenando hasta terminar el remojo.
                      soakProgress = targetProgress;

                      if (safeRemaining == 0L) {
                          soakProgress = 1f;
                          invalidate();
                          return;
                      }

                      progressAnimator =
                          ValueAnimator.ofFloat(targetProgress, 1f);
                      progressAnimator.setDuration(
                          Math.max(450L, safeRemaining * 1000L)
                      );
                      progressAnimator.setInterpolator(
                          new LinearInterpolator()
                      );
                      progressAnimator.addUpdateListener(a -> {
                          soakProgress = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      progressAnimator.start();
                  }

                  public void flashSuccess() {
                      if (flashAnimator != null) flashAnimator.cancel();
                      flashAnimator = ValueAnimator.ofFloat(0f, 1f, 0f);
                      flashAnimator.setDuration(520);
                      flashAnimator.setInterpolator(new AccelerateDecelerateInterpolator());
                      flashAnimator.addUpdateListener(a -> {
                          flash = (float) a.getAnimatedValue();
                          invalidate();
                      });
                      flashAnimator.start();
                  }

                  private void startModeAnimation() {
                      if (rotationAnimator != null) rotationAnimator.cancel();
                      if (pulseAnimator != null) pulseAnimator.cancel();

                      rotation = 0f;
                      pulse = 1f;

                      if (
                          mode == MODE_SYNC ||
                          mode == MODE_PENDING
                      ) {
                          rotationAnimator = ValueAnimator.ofFloat(0f, 360f);
                          rotationAnimator.setRepeatCount(ValueAnimator.INFINITE);
                          rotationAnimator.setInterpolator(new LinearInterpolator());
                          rotationAnimator.setDuration(
                              mode == MODE_PENDING ? 780 : 2400
                          );
                          rotationAnimator.addUpdateListener(a -> {
                              rotation = (float) a.getAnimatedValue();
                              invalidate();
                          });
                          rotationAnimator.start();
                      }

                      if (
                          mode == MODE_ON ||
                          mode == MODE_SOAK ||
                          mode == MODE_FAN
                      ) {
                          pulseAnimator = ValueAnimator.ofFloat(1f, 1.028f);
                          pulseAnimator.setDuration(
                              mode == MODE_SOAK ? 1150 : 1500
                          );
                          pulseAnimator.setRepeatCount(ValueAnimator.INFINITE);
                          pulseAnimator.setRepeatMode(ValueAnimator.REVERSE);
                          pulseAnimator.setInterpolator(new AccelerateDecelerateInterpolator());
                          pulseAnimator.addUpdateListener(a -> {
                              pulse = (float) a.getAnimatedValue();
                              invalidate();
                          });
                          pulseAnimator.start();
                      }
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      super.onDraw(c);

                      float w = getWidth();
                      float h = getHeight();
                      float cx = w / 2f;
                      float cy = h / 2f;
                      float radius = Math.min(w, h) * 0.35f;

                      c.save();
                      c.scale(pulse, pulse, cx, cy);

                      int color;
                      switch (mode) {
                          case MODE_OFF:
                              color = Color.rgb(227,77,89);
                              break;
                          case MODE_SOAK:
                              color = Color.rgb(13,125,246);
                              break;
                          case MODE_ON:
                              color = Color.rgb(19,170,104);
                              break;
                          case MODE_PENDING:
                              color = Color.rgb(240,161,30);
                              break;
                          case MODE_OFFLINE:
                              color = Color.rgb(132,148,167);
                              break;
                          case MODE_FAN:
                              color = Color.rgb(32,183,201);
                              break;
                          default:
                              color = Color.rgb(92,112,136);
                              break;
                      }

                      if (flash > 0f) {
                          int r = Math.min(255, (int)(19 + 80 * flash));
                          int g = Math.min(255, (int)(170 + 70 * flash));
                          int b = Math.min(255, (int)(104 + 80 * flash));
                          color = Color.rgb(r, g, b);
                      }

                      float outer = radius + dpLocal(12);
                      RectF oval = new RectF(
                          cx - outer, cy - outer,
                          cx + outer, cy + outer
                      );

                      c.drawOval(oval, track);

                      float sweep;
                      float startAngle;

                      if (mode == MODE_SYNC) {
                          sweep = 250f;
                          startAngle = -90f + rotation;
                      } else if (mode == MODE_SOAK) {
                          sweep = Math.max(5f, 360f * soakProgress);
                          startAngle = -90f;
                      } else if (mode == MODE_PENDING) {
                          sweep = 285f;
                          startAngle = -90f + rotation;
                      } else {
                          sweep = 360f;
                          startAngle = -90f;
                      }

                      // Circular glow: painted as concentric arcs instead of a rectangular shadow.
                      int glowAlphaOuter = Math.min(90, 28 + (int)(35 * flash));
                      int glowAlphaInner = Math.min(120, 48 + (int)(45 * flash));

                      glow.setStrokeWidth(dpLocal(34 + 5 * flash));
                      glow.setColor(Color.argb(
                          glowAlphaOuter,
                          Color.red(color),
                          Color.green(color),
                          Color.blue(color)
                      ));
                      c.drawArc(
                          oval,
                          startAngle,
                          sweep,
                          false,
                          glow
                      );

                      glow.setStrokeWidth(dpLocal(23 + 3 * flash));
                      glow.setColor(Color.argb(
                          glowAlphaInner,
                          Color.red(color),
                          Color.green(color),
                          Color.blue(color)
                      ));
                      c.drawArc(
                          oval,
                          startAngle,
                          sweep,
                          false,
                          glow
                      );

                      ring.setColor(color);
                      c.drawArc(
                          oval,
                          startAngle,
                          sweep,
                          false,
                          ring
                      );

                      center.setShadowLayer(
                          dpLocal(9),
                          0,
                          dpLocal(4),
                          0x25000000
                      );
                      c.drawCircle(cx, cy, radius, center);
                      center.clearShadowLayer();

                      icon.setColor(color);

                      float iconR = radius * 0.34f;
                      RectF p = new RectF(
                          cx - iconR,
                          cy - iconR,
                          cx + iconR,
                          cy + iconR
                      );

                      c.drawArc(p, -44f, 268f, false, icon);
                      c.drawLine(
                          cx,
                          cy - iconR * 1.05f,
                          cx,
                          cy - iconR * 0.05f,
                          icon
                      );

                      c.restore();
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      super.onDetachedFromWindow();
                      if (rotationAnimator != null) rotationAnimator.cancel();
                      if (pulseAnimator != null) pulseAnimator.cancel();
                      if (flashAnimator != null) flashAnimator.cancel();
                      if (progressAnimator != null) progressAnimator.cancel();
                  }

                  private float dpLocal(float v) {
                      return v * getResources().getDisplayMetrics().density;
                  }
              }
          }
          EOF

      - name: Build permanently signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename signed APK
        run: cp app/build/outputs/apk/release/app-release.apk AireSmart_Remote_v1.0.25_MASK1_Enfriar.apk

      - name: Verify APK signature
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify             --verbose             --print-certs             AireSmart_Remote_v1.0.25_MASK1_Enfriar.apk

      - name: Generate in-app update manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="AireSmart_Remote_v1.0.25_MASK1_Enfriar.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          cat > latest.json <<EOF
          {
            "versionCode": 26,
            "versionName": "1.0.25",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.25/${APK}",
            "sha256": "${SHA256}",
            "notes": "MASK1 visual agregado únicamente al botón ENFRIAR."
          }
          EOF

      - name: Publish permanent AireSmart release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.25"
          APK="AireSmart_Remote_v1.0.25_MASK1_Enfriar.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "$APK" \
              latest.json \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$APK" \
              latest.json \
              --title "AireSmart Remote v1.0.25" \
              --notes "Mismo AireSmart Remote, con efecto Flush visual únicamente en ENFRIAR."
          fi

      - name: Remove decrypted key
        if: always()
        shell: bash
        run: rm -f /tmp/airesmart-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AireSmart-Remote-v1.0.25-MASK1-Enfriar
          path: |
            AireSmart_Remote_v1.0.25_MASK1_Enfriar.apk
            latest.json
