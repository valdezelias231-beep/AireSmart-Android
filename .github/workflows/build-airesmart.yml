              private String buildDeviceBoundOwnerId() {
                  try {
                      String androidId = Settings.Secure.getString(
                          getContentResolver(),
                          Settings.Secure.ANDROID_ID
                      );

                      if (androidId == null || androidId.trim().isEmpty()) {
                          androidId = UUID.randomUUID().toString();
                      }

                      MessageDigest digest =
                          MessageDigest.getInstance("SHA-256");

                      byte[] bytes = digest.digest(
                          (androidId + "|" + getPackageName())
                              .getBytes(StandardCharsets.UTF_8)
                      );

                      StringBuilder hex = new StringBuilder();

                      for (byte b : bytes) {
                          hex.append(
                              String.format("%02x", b & 0xff)
                          );
                      }

                      return "ANDROID2-" + hex.substring(0, 32);

                  } catch (Exception error) {
                      return "ANDROID2-" +
                          UUID.randomUUID().toString();
                  }
              }

              private void pairDevice(
                  String code,
                  Button pairButton,
                  TextView status
              ) {
                  io.execute(() -> {
                      HttpsURLConnection conn = null;

                      try {
                          URL url = new URL(PAIR_API);
                          conn = (HttpsURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(12000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty(
                              "Content-Type",
                              "application/json; charset=UTF-8"
                          );
                          conn.setRequestProperty(
                              "Accept",
                              "application/json"
                          );

                          JSONObject requestBody = new JSONObject();
                          requestBody.put("code", code);
                          requestBody.put("owner_id", ownerId);

                          byte[] payload = requestBody
                              .toString()
                              .getBytes(StandardCharsets.UTF_8);

                          conn.setFixedLengthStreamingMode(payload.length);

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payload);
                              os.flush();
                          }

                          int responseCode = conn.getResponseCode();
                          InputStream stream =
                              responseCode >= 200 && responseCode < 300
                                  ? conn.getInputStream()
                                  : conn.getErrorStream();

                          StringBuilder raw = new StringBuilder();

                          if (stream != null) {
                              try (
                                  BufferedReader reader = new BufferedReader(
                                      new InputStreamReader(
                                          stream,
                                          StandardCharsets.UTF_8
                                      )
                                  )
                              ) {
                                  String line;
                                  while ((line = reader.readLine()) != null) {
                                      raw.append(line);
                                  }
                              }
                          }

                          JSONObject response = raw.length() > 0
                              ? new JSONObject(raw.toString())
                              : new JSONObject();

                          boolean ok =
                              responseCode >= 200 &&
                              responseCode < 300 &&
                              response.optBoolean("ok", false);

                          if (!ok) {
                              String error = response.optString(
                                  "error",
                                  "pairing_failed"
                              );

                              runOnUiThread(() -> {
                                  pairButton.setEnabled(true);
                                  pairButton.setAlpha(1f);
                                  status.setText(pairingErrorText(error));
                                  status.setTextColor(Color.rgb(201,54,64));
                              });
                              return;
                          }

                          String newDeviceId =
                              response.optString("device_id", "").trim();

                          String newPairingRole =
                              response.optString(
                                  "pairing_role",
                                  ""
                              ).trim();

                          JSONObject mqttInfo =
                              response.optJSONObject("mqtt");

                          String newHost =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString("host", "").trim();

                          int newPort =
                              mqttInfo == null
                                  ? 0
                                  : mqttInfo.optInt("port", 0);

                          String newUsername =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo
                                      .optString("username", "")
                                      .trim();

                          String newPassword =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString("password", "");

                          String newTopicBase =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo
                                      .optString("topic_base", "")
                                      .trim();

                          if (
                              newDeviceId.isEmpty() ||
                              newHost.isEmpty() ||
                              newPort <= 0 ||
                              newUsername.isEmpty() ||
                              newPassword.isEmpty() ||
                              newTopicBase.isEmpty()
                          ) {
                              runOnUiThread(() -> {
                                  pairButton.setEnabled(true);
                                  pairButton.setAlpha(1f);
                                  status.setText(
                                      "Respuesta de vinculación incompleta"
                                  );
                                  status.setTextColor(Color.rgb(201,54,64));
                              });
                              return;
                          }

                          try {
                              saveMqttPasswordSecure(newPassword);
                          } catch (Exception error) {
                              runOnUiThread(() -> {
                                  pairButton.setEnabled(true);
                                  pairButton.setAlpha(1f);
                                  status.setText(
                                      "No se pudo proteger la credencial"
                                  );
                                  status.setTextColor(Color.rgb(201,54,64));
                              });
                              return;
                          }

                          deviceId = newDeviceId;
                          host = newHost;
                          port = newPort;
                          username = newUsername;
                          topicBase = newTopicBase;
                          paired = true;

                          prefs.edit()
                              .putBoolean("paired", true)
                              .putString("deviceId", deviceId)
                              .putString("pairingRole", newPairingRole)
                              .putString("host", host)
                              .putInt("port", port)
                              .putString("username", username)
                              .putString("topicBase", topicBase)
                              .remove("password")
                              .apply();

                          runOnUiThread(() -> {
                              status.setText("AIRE SMART VINCULADO");
                              status.setTextColor(Color.rgb(13,136,74));
                              toast("AireSmart vinculado correctamente");

                              mainHandler.postDelayed(
                                  this::openControl,
                                  650
                              );
                          });

                      } catch (Exception e) {
                          runOnUiThread(() -> {
                              pairButton.setEnabled(true);
                              pairButton.setAlpha(1f);
                              status.setText(
                                  "No se pudo conectar. Intenta de nuevo."
                              );
                              status.setTextColor(Color.rgb(201,54,64));
                          });
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  });
              }

              private String pairingErrorText(String error) {
                  if ("pairing_code_not_found".equals(error)) {
                      return "Código no válido";
                  }
                  if ("pairing_code_used".equals(error)) {
                      return "Este código ya fue utilizado";
                  }
                  if ("pairing_code_expired".equals(error)) {
                      return "El código ya venció";
                  }
                  if ("invalid_code".equals(error)) {
                      return "Formato de código no válido [invalid_code]";
                  }
                  if ("invalid_owner_id".equals(error)) {
                      return "Identificador del teléfono no válido [invalid_owner_id]";
                  }
                  if ("phone_already_linked".equals(error)) {
                      return "Este teléfono ya está vinculado [phone_already_linked]";
                  }
                  if ("owner_already_exists".equals(error)) {
                      return "Este AireSmart ya tiene propietario [owner_already_exists]";
                  }
                  if ("invalid_pairing_role".equals(error)) {
                      return "Tipo de vinculación no válido [invalid_pairing_role]";
                  }
                  if ("device_credentials_unavailable".equals(error)) {
                      return "No se pudieron abrir las credenciales del equipo [device_credentials_unavailable]";
                  }
                  if ("device_already_paired".equals(error)) {
                      return "Este AireSmart ya está vinculado [device_already_paired]";
                  }
                  if ("device_not_configured".equals(error)) {
                      return "El AireSmart aún no está preparado [device_not_configured]";
                  }
                  if ("pairing_conflict".equals(error)) {
                      return "Conflicto al guardar la vinculación [pairing_conflict]";
                  }
                  if ("binding_credentials_unavailable".equals(error)) {
                      return "No se pudo recuperar la credencial privada [binding_credentials_unavailable]";
                  }
                  if ("phone_binding_revoked".equals(error)) {
                      return "Este teléfono fue revocado y necesita autorización nueva [phone_binding_revoked]";
                  }
                  if (error != null && error.startsWith("emqx_")) {
                      return "No se pudo crear la credencial privada en EMQX [" + error + "]";
                  }
                  if ("internal_error".equals(error)) {
                      return "Error interno del servicio [internal_error]";
                  }

                  return "No se pudo vincular [" + error + "]";
              }

