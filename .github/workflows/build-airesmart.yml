              private void repairIdentity(
                  String code,
                  Button repairButton,
                  TextView status
              ) {
                  io.execute(() -> {
                      HttpsURLConnection conn = null;

                      try {
                          String newOwnerId = buildDeviceBoundOwnerId();

                          URL url = new URL(REPAIR_API);
                          conn = (HttpsURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(12000);
                          conn.setReadTimeout(12000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty(
                              "Content-Type",
                              "application/json; charset=UTF-8"
                          );
                          conn.setRequestProperty(
                              "Accept",
                              "application/json"
                          );

                          JSONObject requestBody = new JSONObject();
                          requestBody.put("code", code);
                          requestBody.put("owner_id", newOwnerId);

                          byte[] payload = requestBody
                              .toString()
                              .getBytes(StandardCharsets.UTF_8);

                          conn.setFixedLengthStreamingMode(payload.length);

                          try (OutputStream os = conn.getOutputStream()) {
                              os.write(payload);
                              os.flush();
                          }

                          int responseCode = conn.getResponseCode();

                          InputStream stream =
                              responseCode >= 200 && responseCode < 300
                                  ? conn.getInputStream()
                                  : conn.getErrorStream();

                          StringBuilder raw = new StringBuilder();

                          if (stream != null) {
                              try (
                                  BufferedReader reader = new BufferedReader(
                                      new InputStreamReader(
                                          stream,
                                          StandardCharsets.UTF_8
                                      )
                                  )
                              ) {
                                  String line;
                                  while ((line = reader.readLine()) != null) {
                                      raw.append(line);
                                  }
                              }
                          }

                          JSONObject response = raw.length() > 0
                              ? new JSONObject(raw.toString())
                              : new JSONObject();

                          boolean ok =
                              responseCode >= 200 &&
                              responseCode < 300 &&
                              response.optBoolean("ok", false);

                          if (!ok) {
                              String error = response.optString(
                                  "error",
                                  "identity_repair_failed"
                              );

                              runOnUiThread(() -> {
                                  repairButton.setEnabled(true);
                                  repairButton.setAlpha(1f);
                                  status.setText(
                                      identityRepairErrorText(error)
                                  );
                                  status.setTextColor(
                                      Color.rgb(201,54,64)
                                  );
                              });
                              return;
                          }

                          JSONObject mqttInfo =
                              response.optJSONObject("mqtt");

                          String newDeviceId =
                              response.optString(
                                  "device_id",
                                  ""
                              ).trim();

                          String newHost =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString(
                                      "host",
                                      ""
                                  ).trim();

                          int newPort =
                              mqttInfo == null
                                  ? 0
                                  : mqttInfo.optInt(
                                      "port",
                                      0
                                  );

                          String newUsername =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString(
                                      "username",
                                      ""
                                  ).trim();

                          String newPassword =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString(
                                      "password",
                                      ""
                                  );

                          String newTopicBase =
                              mqttInfo == null
                                  ? ""
                                  : mqttInfo.optString(
                                      "topic_base",
                                      ""
                                  ).trim();

                          if (
                              newDeviceId.isEmpty() ||
                              newHost.isEmpty() ||
                              newPort <= 0 ||
                              newUsername.isEmpty() ||
                              newPassword.isEmpty() ||
                              newTopicBase.isEmpty()
                          ) {
                              throw new IllegalStateException(
                                  "repair_response_incomplete"
                              );
                          }

                          saveMqttPasswordSecure(newPassword);

                          ownerId = newOwnerId;
                          deviceId = newDeviceId;
                          host = newHost;
                          port = newPort;
                          username = newUsername;
                          password = newPassword;
                          topicBase = newTopicBase;
                          paired = true;

                          prefs.edit()
                              .putString("ownerId", ownerId)
                              .putInt("ownerIdVersion", 2)
                              .putBoolean("paired", true)
                              .putString("deviceId", deviceId)
                              .putString("host", host)
                              .putInt("port", port)
                              .putString("username", username)
                              .putString("topicBase", topicBase)
                              .remove("password")
                              .apply();

                          runOnUiThread(() -> {
                              repairButton.setEnabled(true);
                              repairButton.setAlpha(1f);
                              status.setText(
                                  "IDENTIDAD REPARADA · RECONECTANDO"
                              );
                              status.setTextColor(
                                  Color.rgb(13,136,74)
                              );

                              toast("Identidad del teléfono reparada");

                              io.execute(() -> {
                                  try {
                                      if (mqtt != null) {
                                          try {
                                              if (mqtt.isConnected()) {
                                                  mqtt.disconnect();
                                              }
                                          } catch (Exception ignored) {}

                                          try {
                                              mqtt.close();
                                          } catch (Exception ignored) {}
                                      }
                                  } finally {
                                      mainHandler.postDelayed(
                                          this::connectMqtt,
                                          500
                                      );
                                  }
                              });
                          });

                      } catch (Exception error) {
                          runOnUiThread(() -> {
                              repairButton.setEnabled(true);
                              repairButton.setAlpha(1f);
                              status.setText(
                                  "No se pudo reparar la identidad"
                              );
                              status.setTextColor(
                                  Color.rgb(201,54,64)
                              );
                          });
                      } finally {
                          if (conn != null) {
                              conn.disconnect();
                          }
                      }
                  });
              }

              private String identityRepairErrorText(String error) {
                  if ("repair_code_not_found".equals(error)) {
                      return "Código de reparación no válido";
                  }
                  if ("repair_code_used".equals(error)) {
                      return "Este código ya fue utilizado";
                  }
                  if ("repair_code_expired".equals(error)) {
                      return "El código de reparación venció";
                  }
                  if ("identity_already_in_use".equals(error)) {
                      return "La nueva identidad ya está en uso";
                  }
                  if ("binding_not_found".equals(error)) {
                      return "No se encontró el teléfono a reparar";
                  }
                  if ("binding_revoked".equals(error)) {
                      return "Ese teléfono ya está revocado";
                  }
                  if (error != null && error.startsWith("emqx_")) {
                      return "No se pudo crear la credencial privada [" +
                          error + "]";
                  }

                  return "No se pudo reparar [" + error + "]";
              }

              private void connectMqtt() {
                  BlackBoxLogger.log(this, "mqtt", "info", "Conectando a MQTT", "Red: " + networkLabel(), -1);
                  setCloud("● CONECTANDO", Color.rgb(240,161,30), "Sincronizando…");
                  systemState.setText("SINCRONIZANDO…");
                  systemState.setTextColor(Color.rgb(92,112,136));
                  heroSub.setText("Esperando estado del AireSmart");
                  powerRing.setMode(PowerRingView.MODE_SYNC);

                  io.execute(() -> {
                      try {
                          if (mqtt != null) {
                              try {
                                  if (mqtt.isConnected()) mqtt.disconnect();
                              } catch (Exception ignored) {}
                              try {
                                  mqtt.close();
                              } catch (Exception ignored) {}
                          }

                          String uri = "ssl://" + host + ":" + port;
                          mqtt = new MqttClient(
                              uri,
                              "airesmart_app_" + UUID.randomUUID().toString().substring(0,8),
                              new MemoryPersistence()
                          );

                          mqtt.setCallback(new MqttCallbackExtended() {
                              @Override
                              public void connectComplete(boolean reconnect, String serverURI) {
                                  BlackBoxLogger.setConnected(MainActivity.this, true);
                                  BlackBoxLogger.log(
                                      MainActivity.this, "mqtt", "ok",
                                      reconnect ? "MQTT reconectado" : "MQTT conectado",
                                      "Red: " + networkLabel(), -1
                                  );
                                  runOnUiThread(() ->
                                      setCloud(
                                          "● BROKER",
                                          Color.rgb(13,136,74),
                                          reconnect ? "Reconectado" : "Conectado"
                                      )
                                  );
                                  subscribeTopics();
                              }

                              @Override
                              public void connectionLost(Throwable cause) {
                                  BlackBoxLogger.setConnected(MainActivity.this, false);
                                  BlackBoxLogger.log(
                                      MainActivity.this, "mqtt", "error", "MQTT desconectado",
                                      safe(cause == null ? null : cause.getMessage()) + " · Red: " + networkLabel(), -1
                                  );
                                  runOnUiThread(() -> {
                                      setCloud("● OFFLINE", Color.rgb(201,54,64), "Conexión perdida");
                                      powerRing.setMode(PowerRingView.MODE_OFFLINE);
                                  });
                              }

                              @Override
                              public void messageArrived(String topic, MqttMessage message) {
                                  handleMessage(
                                      topic,
                                      new String(message.getPayload(), StandardCharsets.UTF_8)
                                  );
                              }

                              @Override
                              public void deliveryComplete(IMqttDeliveryToken token) {}
                          });

                          MqttConnectOptions o = new MqttConnectOptions();
                          o.setUserName(username);
                          o.setPassword(password.toCharArray());
                          o.setAutomaticReconnect(true);
                          o.setCleanSession(true);
                          o.setConnectionTimeout(12);
                          o.setKeepAliveInterval(45);
                          mqtt.connect(o);

                      } catch (Exception e) {
                          BlackBoxLogger.setConnected(MainActivity.this, false);
                          BlackBoxLogger.log(MainActivity.this, "mqtt", "error", "Error de conexión MQTT", safe(e.getMessage()) + " · Red: " + networkLabel(), -1);
                          runOnUiThread(() -> {
                              setCloud("● ERROR", Color.rgb(201,54,64), safe(e.getMessage()));
                              powerRing.setMode(PowerRingView.MODE_OFFLINE);
                          });
                      }
                  });
              }

              private void subscribeTopics() {
                  io.execute(() -> {
                      try {
                          mqtt.subscribe(topicBase + "/state", 1);
                          mqtt.subscribe(topicBase + "/ack", 1);
                          mqtt.subscribe(topicBase + "/status", 1);
                          BlackBoxLogger.log(MainActivity.this, "mqtt", "ok", "Suscripciones activas", "state · ack · status", -1);
                      } catch (Exception e) {
                          BlackBoxLogger.log(MainActivity.this, "mqtt", "error", "Error de suscripción", safe(e.getMessage()), -1);
                          runOnUiThread(() ->
                              setCloud(
                                  "● ERROR",
                                  Color.rgb(201,54,64),
                                  "Suscripción MQTT"
                              )
                          );
                      }
                  });
              }

              private void clearPendingCommand() {
                  pendingId = null;
                  pendingAction = null;
                  pendingValue = null;
                  pendingSentAt = 0L;
              }

              private boolean stateConfirmsPending(
                  String state,
                  boolean currentMotor,
                  boolean currentHigh,
                  boolean currentPump
              ) {
                  if (
                      pendingId == null ||
                      pendingAction == null ||
                      pendingValue == null
                  ) {
                      return false;
                  }

                  String upper =
                      state == null ? "" : state.toUpperCase();

                  if ("power".equals(pendingAction)) {
                      if ("true".equals(pendingValue)) {
                          return
                              upper.contains("REMOJ") ||
                              upper.contains("ENCEND") ||
                              currentMotor ||
                              currentPump;
                      }

                      return
                          upper.contains("APAG") &&
                          !currentMotor;
                  }

                  if ("speed".equals(pendingAction)) {
                      if (!currentMotor) {
                          return false;
                      }

                      if ("high".equals(pendingValue)) {
                          return currentHigh;
                      }

                      if ("low".equals(pendingValue)) {
                          return !currentHigh;
                      }
                  }

                  if ("mode".equals(pendingAction)) {
                      if ("fan".equals(pendingValue)) {
                          return
                              upper.contains("SOLO AIRE") &&
                              currentMotor &&
                              !currentPump;
                      }

                      if ("cool".equals(pendingValue)) {
                          return
                              !upper.contains("SOLO AIRE") &&
                              (
                                  upper.contains("REMOJ") ||
                                  upper.contains("ENCEND") ||
                                  currentPump
                              );
                      }
                  }

                  return false;
              }

              private void confirmPendingFromState(
                  String state,
                  boolean currentMotor,
                  boolean currentHigh,
                  boolean currentPump
              ) {
                  if (
                      !stateConfirmsPending(
                          state,
                          currentMotor,
                          currentHigh,
                          currentPump
                      )
                  ) {
                      return;
                  }

                  mainHandler.removeCallbacks(ackTimeout);
                  long latency = pendingSentAt > 0 ? System.currentTimeMillis() - pendingSentAt : -1;
                  BlackBoxLogger.log(
                      this, "ack", "ok", "Orden confirmada por estado",
                      commandLabel(pendingAction, pendingValue) + " · " + safe(state), latency
                  );
                  clearPendingCommand();

                  runOnUiThread(() ->
                      showAck(
                          "ORDEN CONFIRMADA",
                          true
                      )
                  );
              }

              private void handleMessage(String topic, String payload) {
                  try {
                      JSONObject j = new JSONObject(payload);

                      if (topic.endsWith("/state")) {
                          motorOn = j.optBoolean("motor", false);
                          high = j.optBoolean("high", false);
                          boolean pumpOn =
                              j.optBoolean("pump", false);
                          String state = j.optString(
                              "state",
                              motorOn ? "ENCENDIDO" : "APAGADO"
                          );
                          long soak = j.optLong("soakRemaining", 0);
                          logStateIfChanged(state, motorOn, high, pumpOn, soak);

                          confirmPendingFromState(
                              state,
                              motorOn,
                              high,
                              pumpOn
                          );

                          runOnUiThread(() -> {
                              setCloud(
                                  "● EN LÍNEA",
                                  Color.rgb(13,136,74),
                                  "Estado sincronizado"
                              );
                              paintState(state, soak);
                          });

                      } else if (topic.endsWith("/status")) {
                          boolean online = j.optBoolean("online", false);
                          String kind =
                              j.optString("kind", "").trim().toLowerCase();

                          if ("state".equals(kind)) {
                              motorOn = j.optBoolean("motor", false);
                              high = j.optBoolean("high", false);
                              boolean pumpOn =
                                  j.optBoolean("pump", false);
                              String state = j.optString(
                                  "state",
                                  motorOn ? "ENCENDIDO" : "APAGADO"
                              );
                              long soak =
                                  j.optLong("soakRemaining", 0);
                              logStateIfChanged(state, motorOn, high, pumpOn, soak);

                              confirmPendingFromState(
                                  state,
                                  motorOn,
                                  high,
                                  pumpOn
                              );

                              runOnUiThread(() -> {
                                  setCloud(
                                      "● EN LÍNEA",
                                      Color.rgb(13,136,74),
                                      "Estado sincronizado"
                                  );
                                  paintState(state, soak);
                              });
                              return;
                          }

                          if ("ack".equals(kind)) {
                              String id = j.optString("id", "");

                              if (
                                  pendingId == null ||
                                  !pendingId.equals(id)
                              ) {
                                  return;
                              }

                              String ackAction = pendingAction;
                              String ackValue = pendingValue;
                              boolean speedAck = "speed".equals(ackAction);

                              boolean accepted =
                                  j.optBoolean("accepted", false);
                              String result =
                                  j.optString(
                                      "result",
                                      accepted
                                          ? "accepted"
                                          : "rejected"
                                  );

                              motorOn =
                                  j.optBoolean("motor", motorOn);
                              high =
                                  j.optBoolean("high", high);
                              String state =
                                  j.optString(
                                      "state",
                                      motorOn
                                          ? "ENCENDIDO"
                                          : "APAGADO"
                                  );
                              long soak =
                                  j.optLong("soakRemaining", 0);
                              boolean speedStable =
                                  speedAck &&
                                  accepted &&
                                  motorOn &&
                                  (
                                      ("high".equals(ackValue) && high) ||
                                      ("low".equals(ackValue) && !high)
                                  );
                              long latency = pendingSentAt > 0 ? System.currentTimeMillis() - pendingSentAt : -1;
                              BlackBoxLogger.log(
                                  this, "ack", accepted ? "ok" : "error",
                                  accepted ? "ACK recibido" : "Orden rechazada",
                                  commandLabel(ackAction, ackValue) + " · " + friendlyResult(result),
                                  latency
                              );

                              // v1.0.34: en cambio de velocidad el ACK puede llegar
                              // mientras el motor está apagado por protección. En ese
                              // caso NO cerramos pending: así APAGADO sigue oculto y
                              // el Flip/aro naranja continúan hasta motor=true + destino.
                              if (speedAck && accepted && !speedStable) {
                                  runOnUiThread(() -> {
                                      showAck("ORDEN RECIBIDA · CAMBIANDO", false);
                                      paintState(state, soak);
                                  });
                                  return;
                              }

                              mainHandler.removeCallbacks(ackTimeout);
                              boolean cancelSpeedVisual = speedAck && !accepted;
                              clearPendingCommand();

                              runOnUiThread(() -> {
                                  if (cancelSpeedVisual && speedVisual != null) {
                                      speedVisual.cancelPendingSelection();
                                  }
                                  showAck(
                                      accepted
                                          ? "ORDEN CONFIRMADA"
                                          : "ORDEN RECHAZADA · " +
                                              friendlyResult(result),
                                      accepted
                                  );
                                  paintState(state, soak);
                              });
                              return;
                          }

                          BlackBoxLogger.setConnected(this, online);
                          if (!online) {
                              BlackBoxLogger.log(this, "mqtt", "warn", "AireSmart reportó offline", "El dispositivo no está disponible", -1);
                          }
                          runOnUiThread(() -> {
                              setCloud(
                                  online ? "● EN LÍNEA" : "● OFFLINE",
                                  online ? Color.rgb(13,136,74) : Color.rgb(201,54,64),
                                  online ? "AireSmart conectado" : "AireSmart sin conexión"
                              );
                              if (!online) {
                                  powerRing.setMode(
                                      PowerRingView.MODE_OFFLINE
                                  );
                              }
                          });

                      } else if (topic.endsWith("/ack")) {
                          String id = j.optString("id", "");

                          // En multiusuario todos los teléfonos reciben /ack.
                          // Solo este teléfono debe procesar el ACK de SU orden.
                          if (
                              pendingId == null ||
                              !pendingId.equals(id)
                          ) {
                              return;
                          }

                          String ackAction = pendingAction;
                          String ackValue = pendingValue;
                          boolean speedAck = "speed".equals(ackAction);

                          boolean accepted = j.optBoolean("accepted", false);
                          String result = j.optString(
                              "result",
                              accepted ? "accepted" : "rejected"
                          );

                          motorOn = j.optBoolean("motor", motorOn);
                          high = j.optBoolean("high", high);
                          String state = j.optString(
                              "state",
                              motorOn ? "ENCENDIDO" : "APAGADO"
                          );
                          boolean speedStable =
                              speedAck &&
                              accepted &&
                              motorOn &&
                              (
                                  ("high".equals(ackValue) && high) ||
                                  ("low".equals(ackValue) && !high)
                              );
                          long latency = pendingSentAt > 0 ? System.currentTimeMillis() - pendingSentAt : -1;
                          BlackBoxLogger.log(
                              this, "ack", accepted ? "ok" : "error",
                              accepted ? "ACK recibido" : "Orden rechazada",
                              commandLabel(ackAction, ackValue) + " · " + friendlyResult(result),
                              latency
                          );

                          if (speedAck && accepted && !speedStable) {
                              runOnUiThread(() -> {
                                  showAck("ORDEN RECIBIDA · CAMBIANDO", false);
                                  paintState(state, 0);
                              });
                              return;
                          }

                          mainHandler.removeCallbacks(ackTimeout);
                          boolean cancelSpeedVisual = speedAck && !accepted;
                          clearPendingCommand();

                          runOnUiThread(() -> {
                              if (cancelSpeedVisual && speedVisual != null) {
                                  speedVisual.cancelPendingSelection();
                              }
                              showAck(
                                  accepted
                                      ? "ORDEN CONFIRMADA"
                                      : "ORDEN RECHAZADA · " + friendlyResult(result),
                                  accepted
                              );

                              // El ACK no incluye soakRemaining.
                              // Si sigue REMOJANDO esperamos el /state retenido
                              // para no reiniciar el aro desde cero.
                              if (!state.toUpperCase().contains("REMOJ")) {
                                  paintState(state, 0);
                              }
                          });
                      }

                  } catch (Exception e) {
                      BlackBoxLogger.log(this, "error", "error", "Mensaje MQTT no válido", safe(e.getMessage()), -1);
                      runOnUiThread(() -> showAck("MENSAJE MQTT NO VÁLIDO", false));
                  }
              }

              private void sendPower(boolean on) {
                  sendCommand("power", on ? "true" : "false", true);
              }

              private void sendSpeed(boolean makeHigh) {
                  if (pendingId != null) {
                      return;
                  }

                  if (speedVisual != null) {
                      speedVisual.beginPendingSelection(makeHigh ? 1 : 0);
                  }

                  sendCommand("speed", makeHigh ? "high" : "low", false);
              }

              private void sendMode(String mode) {
                  sendCommand("mode", mode, false);
              }

              private void sendCommand(String action, String value, boolean boolValue) {
                  if (mqtt == null || !mqtt.isConnected()) {
                      logAsync("cmd", "error", "Orden no enviada", commandLabel(action, value) + " · MQTT sin conexión", -1);
                      toast("AireSmart no está conectado");
                      return;
                  }

                  String id =
                      System.currentTimeMillis() + "-" +
                      UUID.randomUUID().toString().substring(0,6);

                  String json = boolValue
                      ? "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":"+value+"}"
                      : "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":\""+value+"\"}";

                  pendingId = id;
                  pendingAction = action;
                  pendingValue = value;
                  pendingSentAt = System.currentTimeMillis();
                  logAsync("cmd", "info", "Orden enviada", commandLabel(action, value) + " · Red: " + networkLabel(), -1);
                  showAck("ENVIANDO ORDEN…", false);

                  if ("power".equals(action) && "false".equals(value)) {
                      systemState.setText("APAGANDO…");
                      systemState.setTextColor(Color.rgb(201,54,64));
                      heroSub.setText("Esperando confirmación del AireSmart");
                      powerRing.setMode(PowerRingView.MODE_OFFING);
                  } else if ("speed".equals(action)) {
                      systemState.setText("CAMBIANDO VELOCIDAD");
                      systemState.setTextColor(Color.rgb(240,139,42));
                      heroSub.setText("Protección del motor activa");
                      powerRing.setMode(PowerRingView.MODE_SPEED);
                  } else {
                      powerRing.setMode(PowerRingView.MODE_PENDING);
                  }

                  mainHandler.removeCallbacks(ackTimeout);
                  mainHandler.postDelayed(ackTimeout, 8000);

                  io.execute(() -> {
                      try {
                          MqttMessage m =
                              new MqttMessage(json.getBytes(StandardCharsets.UTF_8));
                          m.setQos(1);
                          m.setRetained(false);
                          mqtt.publish(topicBase + "/cmd", m);
                          BlackBoxLogger.log(MainActivity.this, "mqtt", "ok", "MQTT publicado", commandLabel(action, value), -1);

                      } catch (Exception e) {
                          BlackBoxLogger.log(MainActivity.this, "cmd", "error", "Error al enviar", commandLabel(action, value) + " · " + safe(e.getMessage()), -1);
                          runOnUiThread(() -> {
                              mainHandler.removeCallbacks(ackTimeout);
                              clearPendingCommand();
                              showAck(
                                  "ERROR AL ENVIAR · " + safe(e.getMessage()),
                                  false
                              );
                              restoreRing();
                          });
                      }
                  });
              }

              private void paintState(String state, long soak) {
                  String upper = state == null ? "--" : state.toUpperCase();
                  boolean soakingNow = soak > 0 || upper.contains("REMOJ");
                  boolean fanNow = upper.contains("SOLO AIRE");
                  boolean speedPending =
                      pendingId != null &&
                      "speed".equals(pendingAction);

                  // Durante el corte eléctrico de protección al cambiar velocidad,
                  // el ESP32 puede publicar motor=false/APAGADO por un instante.
                  // Ese estado transitorio no debe reemplazar la animación de cambio.
                  if (speedPending) {
                      systemState.setText("CAMBIANDO VELOCIDAD");
                      systemState.setTextColor(Color.rgb(240,139,42));
                      heroSub.setText("Protección del motor activa");
                      powerRing.setHighSpeed(high);
                      powerRing.setMode(PowerRingView.MODE_SPEED);
                      paintSpeedButtons();
                      return;
                  }

                  fanMode = fanNow;
                  systemActive = soakingNow || !upper.contains("APAGADO");
                  powerRing.setHighSpeed(high);

                  if (soakingNow) {
                      systemState.setText("REMOJANDO");
                      systemState.setTextColor(Color.rgb(13,125,246));
                      heroSub.setText("Preparando enfriamiento");

                      // El ciclo de remojo del firmware es de 120 s.
                      // El ESP32 publica soakRemaining real, por lo que el aro
                      // debe partir de 1 - (restante / 120), incluso si la APK
                      // se abre a la mitad del ciclo.
                      long safeRemaining = Math.max(0L, Math.min(120L, soak));

                      powerRing.setMode(PowerRingView.MODE_SOAK);
                      powerRing.setSoakRemaining(safeRemaining);

                      wasSoaking = true;

                  } else if (fanNow && motorOn) {
                      systemState.setText(
                          high ? "SOLO AIRE · ALTA" : "SOLO AIRE · BAJA"
                      );
                      systemState.setTextColor(Color.rgb(22,151,170));
                      heroSub.setText("Ventilación sin bomba");
                      systemActive = true;
                      powerRing.setMode(PowerRingView.MODE_FAN);

                      wasSoaking = false;
                      soakTotalSeconds = 0;
                      lastSoakRemaining = 0;

                  } else if (motorOn || upper.contains("ENCENDIDO")) {
                      systemState.setText(
                          high ? "ENCENDIDO · ALTA" : "ENCENDIDO · BAJA"
                      );
                      systemState.setTextColor(Color.rgb(7,136,74));
                      heroSub.setText("Funcionamiento normal");
                      systemActive = true;
                      powerRing.setMode(PowerRingView.MODE_ON);

                      wasSoaking = false;
                      soakTotalSeconds = 0;
                      lastSoakRemaining = 0;

                  } else {
                      systemState.setText("APAGADO");
                      systemState.setTextColor(Color.rgb(201,54,64));
                      heroSub.setText("Equipo en espera");
                      systemActive = false;
                      powerRing.setMode(PowerRingView.MODE_OFF);

                      wasSoaking = false;
                      soakTotalSeconds = 0;
                      lastSoakRemaining = 0;
                  }

                  paintSpeedButtons();
              }

              private void restoreRing() {
                  powerRing.setHighSpeed(high);
                  if (!systemActive) {
                      powerRing.setMode(PowerRingView.MODE_OFF);
                  } else if (!motorOn) {
                      powerRing.setMode(PowerRingView.MODE_SOAK);
                  } else if (fanMode) {
                      powerRing.setMode(PowerRingView.MODE_FAN);
                  } else {
                      powerRing.setMode(PowerRingView.MODE_ON);
                  }
              }

              private void paintSpeedButtons() {
                  boolean speedPending =
                      pendingId != null &&
                      "speed".equals(pendingAction);
                  boolean ready = motorOn || speedPending;
                  int inactive = Color.rgb(92,112,136);

                  coolButton.setEnabled(true);
                  fanButton.setEnabled(true);

                  int modeSelection = -1;
                  if (fanMode) {
                      modeSelection = 1;
                  } else if (systemActive) {
                      modeSelection = 0;
                  }

                  if (modeVisual != null) {
                      modeVisual.setReady(true);
                      modeVisual.setSelection(modeSelection);
                  }

                  coolButton.setTextColor(
                      modeSelection == 0 ? Color.WHITE : inactive
                  );
                  fanButton.setTextColor(
                      modeSelection == 1 ? Color.WHITE : inactive
                  );

                  lowButton.setEnabled(ready && !speedPending);
                  highButton.setEnabled(ready && !speedPending);

                  int visualSpeedSelection = high ? 1 : 0;
                  if (
                      speedPending &&
                      speedVisual != null &&
                      speedVisual.getSelection() >= 0
                  ) {
                      visualSpeedSelection = speedVisual.getSelection();
                  }

                  if (speedVisual != null) {
                      speedVisual.setReady(ready);

                      // Durante la pausa de protección el ESP32 puede reportar
                      // motor=false. No borrar la selección: conservar el botón
                      // origen hasta que ACK/state confirme el destino.
                      if (!speedPending) {
                          speedVisual.setSelection(
                              ready ? (high ? 1 : 0) : -1
                          );
                      }
                  }

                  if (!ready) {
                      lowButton.setAlpha(0.45f);
                      highButton.setAlpha(0.45f);
                      lowButton.setTextColor(inactive);
                      highButton.setTextColor(inactive);
                      return;
                  }

                  lowButton.setAlpha(1f);
                  highButton.setAlpha(1f);
                  lowButton.setTextColor(
                      visualSpeedSelection == 0
                          ? Color.WHITE
                          : inactive
                  );
                  highButton.setTextColor(
                      visualSpeedSelection == 1
                          ? Color.WHITE
                          : inactive
                  );
              }

              private void showAck(String message, boolean success) {
                  mainHandler.removeCallbacks(clearAck);
                  ackState.animate().cancel();
                  ackState.animate()
                      .alpha(0f)
                      .setDuration(130)
                      .withEndAction(() -> {
                          ackState.setText(message);
                          ackState.setTextColor(
                              success
                                  ? Color.rgb(13,136,74)
                                  : Color.rgb(99,119,143)
                          );
                          ackState.animate().alpha(1f).setDuration(210).start();

                          if (success && powerRing != null) {
                              powerRing.performHapticFeedback(
                                  HapticFeedbackConstants.CONFIRM
                              );
                              powerRing.flashSuccess();
                          }

                          if (!message.startsWith("ENVIANDO")) {
                              mainHandler.postDelayed(clearAck, 2600);
                          }
                      })
                      .start();
              }

              private void addPressEffect(View v) {
                  v.setOnTouchListener((view, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          view.animate()
                              .scaleX(0.965f)
                              .scaleY(0.965f)
                              .setDuration(90)
                              .start();
                      } else if (
                          event.getAction() == MotionEvent.ACTION_UP ||
                          event.getAction() == MotionEvent.ACTION_CANCEL
                      ) {
                          view.animate()
                              .scaleX(1f)
                              .scaleY(1f)
                              .setDuration(180)
                              .setInterpolator(new AccelerateDecelerateInterpolator())
                              .start();
                      }
                      return false;
                  });
              }

              private void popSelected(View v) {
                  v.animate().cancel();
                  v.setScaleX(0.985f);
                  v.setScaleY(0.985f);
                  v.animate()
                      .scaleX(1.015f)
                      .scaleY(1.015f)
                      .setDuration(140)
                      .withEndAction(() ->
                          v.animate()
                              .scaleX(1f)
                              .scaleY(1f)
                              .setDuration(170)
                              .start()
                      )
                      .start();
              }

              private void animateEntrance(LinearLayout root) {
                  root.post(() -> {
                      int count = root.getChildCount();
                      for (int i = 0; i < count; i++) {
                          View child = root.getChildAt(i);
                          child.setAlpha(0f);
                          child.setTranslationY(dp(12));
                          child.animate()
                              .alpha(1f)
                              .translationY(0f)
                              .setStartDelay(i * 45L)
                              .setDuration(320)
                              .setInterpolator(new AccelerateDecelerateInterpolator())
                              .start();
                      }
                  });
              }

              private String commandLabel(String action, String value) {
                  if ("power".equals(action)) return "true".equals(value) ? "ENCENDER" : "APAGAR";
                  if ("speed".equals(action)) return "high".equals(value) ? "VELOCIDAD ALTA" : "VELOCIDAD BAJA";
                  if ("mode".equals(action)) return "fan".equals(value) ? "SOLO AIRE" : "ENFRIAR";
                  return safe(action) + " " + safe(value);
              }

              private void logStateIfChanged(String state, boolean motor, boolean highNow, boolean pump, long soak) {
                  String key = safe(state) + "|" + motor + "|" + highNow + "|" + pump + "|" + soak;
                  if (key.equals(lastLoggedState)) return;
                  lastLoggedState = key;
                  String detail = "motor=" + (motor ? "ON" : "OFF") +
                      " · bomba=" + (pump ? "ON" : "OFF") +
                      " · velocidad=" + (highNow ? "ALTA" : "BAJA") +
                      (soak > 0 ? " · remojo=" + soak + "s" : "");
                  BlackBoxLogger.log(this, "state", "info", "Estado ESP32: " + safe(state), detail, -1);
              }

              private void logAsync(
                  String type,
                  String level,
                  String title,
                  String detail,
                  long latencyMs
              ) {
                  final String safeType = type;
                  final String safeLevel = level;
                  final String safeTitle = title;
                  final String safeDetail = detail;
                  diagIo.execute(() ->
                      BlackBoxLogger.log(
                          getApplicationContext(),
                          safeType,
                          safeLevel,
                          safeTitle,
                          safeDetail,
                          latencyMs
                      )
                  );
              }

              private String networkLabel() {
                  try {
                      android.net.ConnectivityManager cm = (android.net.ConnectivityManager)getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (cm == null) return "desconocida";
                      android.net.Network n = cm.getActiveNetwork();
                      if (n == null) return "sin red";
                      android.net.NetworkCapabilities c = cm.getNetworkCapabilities(n);
                      if (c == null) return "desconocida";
                      if (c.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI)) return "Wi-Fi";
                      if (c.hasTransport(android.net.NetworkCapabilities.TRANSPORT_CELLULAR)) return "datos móviles";
                      if (c.hasTransport(android.net.NetworkCapabilities.TRANSPORT_ETHERNET)) return "Ethernet";
                      return "otra";
                  } catch (Exception e) { return "desconocida"; }
              }

              private String friendlyResult(String result) {
                  if ("already_on_or_starting".equals(result)) return "ya estaba encendido";
                  if ("already_off".equals(result)) return "ya estaba apagado";
                  if ("already_low".equals(result)) return "ya estaba en baja";
                  if ("already_high".equals(result)) return "ya estaba en alta";
                  if ("not_ready".equals(result)) return "espera a que termine el remojo";
                  if ("duplicate_ignored".equals(result)) return "orden duplicada";
                  return result == null || result.isEmpty()
                      ? "sin detalle"
                      : result;
              }

              private void setCloud(String txt, int color, String detail) {
                  cloudStatus.setText(txt);
                  cloudStatus.setTextColor(color);
                  detailState.setText(detail);
              }

              private String safe(String s) {
                  return s == null ? "sin detalle" : s;
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s);
                  v.setTextSize(sp);
                  v.setTextColor(color);
                  v.setGravity(Gravity.CENTER_HORIZONTAL);
                  if (bold) {
                      v.setTypeface(v.getTypeface(), Typeface.BOLD);
                  }
                  return v;
              }

              private LinearLayout card() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(18), dp(18), dp(18), dp(18));
                  l.setBackground(bg(Color.rgb(245,246,248), 22));
                  l.setElevation(dp(2));
                  return l;
              }

              private Button button(String s, int color) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setTypeface(b.getTypeface(), Typeface.BOLD);
                  b.setBackground(bg(color, 14));
                  b.setAllCaps(false);
                  return b;
              }

              private Button compactOverlayButton(String label) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextColor(Color.rgb(92,112,136));
                  b.setTextSize(13);
                  b.setTypeface(b.getTypeface(), Typeface.BOLD);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setMinHeight(0);
                  b.setMinimumHeight(0);
                  b.setMinWidth(0);
                  b.setMinimumWidth(0);
                  b.setPadding(0, 0, 0, 0);
