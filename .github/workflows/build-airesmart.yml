              private GradientDrawable bg(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              private void space(LinearLayout l, int h) {
                  View v = new View(this);
                  l.addView(v, new LinearLayout.LayoutParams(1, dp(h)));
              }

              private void spaceHorizontal(LinearLayout l, int w) {
                  View v = new View(this);
                  l.addView(v, new LinearLayout.LayoutParams(dp(w), 1));
              }

              private LinearLayout.LayoutParams lp(int w, int h) {
                  return new LinearLayout.LayoutParams(
                      w,
                      h < 0 ? h : dp(h)
                  );
              }

              private int dp(int v) {
                  return Math.round(
                      v * getResources().getDisplayMetrics().density
                  );
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  diagIo.shutdown();
                  io.execute(() -> {
                      try {
                          if (mqtt != null) {
                              if (mqtt.isConnected()) mqtt.disconnect();
                              mqtt.close();
                          }
                      } catch (Exception ignored) {}
                  });
              }

              public static class AnimatedPairView extends View {
                  public static final int TYPE_MODE = 0;
                  public static final int TYPE_SPEED = 1;

                  private final int type;
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path liquidPath = new Path();
                  private final RectF left = new RectF();
                  private final RectF right = new RectF();
                  private final Camera camera = new Camera();
                  private final Matrix cameraMatrix = new Matrix();
                  private final float density;
                  private final ValueAnimator loop;

                  private int selection = -1;
                  private int previousSelection = -1;
                  private int pendingSelection = -1;
                  private boolean ready = true;
                  private float phase = 0f;
                  private float selectProgress = 1f;
                  private float transferProgress = -1f;
                  private int transferFrom = -1;
                  private int transferTo = -1;
                  private ValueAnimator selectAnimator;
                  private ValueAnimator transferAnimator;

                  public AnimatedPairView(Context context, int type) {
                      super(context);
                      this.type = type;
                      density = getResources().getDisplayMetrics().density;
                      setLayerType(View.LAYER_TYPE_HARDWARE, null);

                      loop = ValueAnimator.ofFloat(0f, 1f);
                      loop.setDuration(type == TYPE_SPEED ? 1800L : 2800L);
                      loop.setRepeatCount(ValueAnimator.INFINITE);
                      loop.setInterpolator(new LinearInterpolator());
                      loop.addUpdateListener(a -> {
                          phase = (float)a.getAnimatedValue();
                          invalidate();
                      });
                      loop.start();
                  }

                  private float dpv(float v) {
                      return v * density;
                  }

                  public void setReady(boolean value) {
                      if (ready == value) return;
                      ready = value;
                      invalidate();
                  }

                  public int getSelection() {
                      return selection;
                  }

                  public void cancelPendingSelection() {
                      pendingSelection = -1;
                      if (transferAnimator != null) {
                          transferAnimator.cancel();
                      }
                      transferProgress = -1f;
                      invalidate();
                  }

                  public void beginPendingSelection(int value) {
                      if (
                          type != TYPE_SPEED ||
                          value < 0 ||
                          value > 1
                      ) {
                          return;
                      }

                      pendingSelection = value;

                      if (
                          selection >= 0 &&
                          selection != value
                      ) {
                          startTransfer(selection, value);
                      }

                      invalidate();
                  }

                  public void setSelection(int value) {
                      if (selection == value) {
                          if (
                              type == TYPE_SPEED &&
                              pendingSelection == value
                          ) {
                              // ACK de la misma velocidad: no reiniciar ninguna
                              // animación. Solo cerrar el estado pendiente.
                              pendingSelection = -1;
                              if (
                                  transferAnimator == null ||
                                  !transferAnimator.isRunning()
                              ) {
                                  transferProgress = -1f;
                              }
                              invalidate();
                          }
                          return;
                      }

                      boolean pendingCommit =
                          type == TYPE_SPEED &&
                          pendingSelection == value;

                      // v1.0.34: ACK/state confirma sin crear una segunda animación.
                      // beginPendingSelection() ya arrancó el Flip 3D al tocar el
                      // botón. Aquí solo confirmamos el destino y dejamos correr
                      // exactamente el mismo animator hasta su último fotograma.
                      if (pendingCommit) {
                          previousSelection = selection;
                          selection = value;
                          pendingSelection = -1;

                          // No reiniciar selectProgress ni el loop ambiental.
                          // Si el Flip sigue vivo, continúa sin cortes. Si ya acabó
                          // y estaba reteniendo el último frame, hacemos el handoff
                          // al estado final, que visualmente es idéntico.
                          selectProgress = 1f;
                          if (
                              transferAnimator == null ||
                              !transferAnimator.isRunning()
                          ) {
                              transferProgress = -1f;
                          }

                          invalidate();
                          return;
                      }

                      previousSelection = selection;
                      selection = value;

                      if (selectAnimator != null) selectAnimator.cancel();
                      selectProgress = 0f;
                      selectAnimator = ValueAnimator.ofFloat(0f, 1f);
                      selectAnimator.setDuration(650L);
                      selectAnimator.setInterpolator(
                          new AccelerateDecelerateInterpolator()
                      );
                      selectAnimator.addUpdateListener(a -> {
                          selectProgress = (float)a.getAnimatedValue();
                          invalidate();
                      });
                      selectAnimator.start();

                      if (
                          type == TYPE_SPEED &&
                          previousSelection >= 0 &&
                          selection >= 0 &&
                          previousSelection != selection
                      ) {
                          startTransfer(previousSelection, selection);
                      }
                  }

                  private void startTransfer(int from, int to) {
                      if (transferAnimator != null) transferAnimator.cancel();
                      transferFrom = from;
                      transferTo = to;
                      transferProgress = 0f;
                      transferAnimator = ValueAnimator.ofFloat(0f, 1f);
                      transferAnimator.setDuration(700L);
                      transferAnimator.setInterpolator(
                          new AccelerateDecelerateInterpolator()
                      );
                      transferAnimator.addUpdateListener(a -> {
                          transferProgress = (float)a.getAnimatedValue();
                          invalidate();
                      });
                      transferAnimator.addListener(
                          new AnimatorListenerAdapter() {
                              @Override
                              public void onAnimationEnd(Animator animation) {
                                  // Si todavía esperamos ACK, conservamos el último
                                  // fotograma del Flip 3D. Así no vuelve de golpe
                                  // al botón anterior durante la protección del motor.
                                  transferProgress =
                                      pendingSelection >= 0 ? 1f : -1f;
                                  invalidate();
                              }
                          }
                      );
                      transferAnimator.start();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);

                      float gap = dpv(12f);
                      float radius = dpv(16f);
                      float w = getWidth();
                      float h = getHeight();
                      float each = (w - gap) / 2f;

                      left.set(0f, 0f, each, h);
                      right.set(each + gap, 0f, w, h);

                      drawInactive(canvas, left, radius);
                      drawInactive(canvas, right, radius);

                      if (!ready && type == TYPE_SPEED) {
                          paint.setColor(Color.argb(80, 255, 255, 255));
                          canvas.drawRoundRect(left, radius, radius, paint);
                          canvas.drawRoundRect(right, radius, radius, paint);
                          return;
                      }

                      boolean flipActive =
                          type == TYPE_SPEED &&
                          transferProgress >= 0f;

                      if (!flipActive) {
                          if (selection == 0) {
                              if (type == TYPE_MODE) {
                                  drawCool(canvas, left, radius);
                              } else {
                                  drawLow(canvas, left, radius);
                              }
                          } else if (selection == 1) {
                              if (type == TYPE_MODE) {
                                  drawFan(canvas, right, radius);
                              } else {
                                  drawHigh(canvas, right, radius);
                              }
                          }
                      }

                      if (flipActive) {
                          drawFlipTransfer(canvas, radius);
                      } else if (
                          type == TYPE_SPEED &&
                          pendingSelection >= 0
                      ) {
                          drawPendingTarget(
                              canvas,
                              pendingSelection == 0 ? left : right,
                              radius,
                              pendingSelection
                          );
                      }
                  }

                  private void drawInactive(
                      Canvas canvas,
                      RectF rect,
                      float radius
                  ) {
                      paint.setStyle(Paint.Style.FILL);
                      paint.setColor(Color.rgb(220,226,233));
                      paint.clearShadowLayer();
                      canvas.drawRoundRect(rect, radius, radius, paint);
                  }

                  private void drawCool(
                      Canvas canvas,
                      RectF rect,
                      float radius
                  ) {
                      canvas.save();
                      canvas.clipPath(roundPath(rect, radius));

                      float p = Math.max(0.02f, selectProgress);
                      float top = rect.bottom - rect.height() * p;
                      float wave = dpv(3.2f);
                      float offset = (float)Math.sin(phase * Math.PI * 2.0)
                          * dpv(4f);

                      liquidPath.reset();
                      liquidPath.moveTo(rect.left - dpv(8), top);
                      liquidPath.cubicTo(
                          rect.left + rect.width() * 0.28f,
                          top - wave + offset * 0.15f,
                          rect.left + rect.width() * 0.68f,
                          top + wave - offset * 0.15f,
                          rect.right + dpv(8),
                          top
                      );
                      liquidPath.lineTo(rect.right + dpv(8), rect.bottom);
                      liquidPath.lineTo(rect.left - dpv(8), rect.bottom);
                      liquidPath.close();

                      paint.setColor(Color.rgb(91,166,239));
                      paint.setStyle(Paint.Style.FILL);
                      canvas.drawPath(liquidPath, paint);

                      paint.setColor(Color.argb(55,255,255,255));
                      canvas.drawRect(
                          rect.left,
                          top,
                          rect.right,
                          Math.min(rect.bottom, top + dpv(4f)),
                          paint
                      );
                      canvas.restore();
                  }

                  private void drawFan(
                      Canvas canvas,
                      RectF rect,
                      float radius
                  ) {
                      paint.setColor(Color.rgb(48,190,197));
                      canvas.drawRoundRect(rect, radius, radius, paint);

                      canvas.save();
                      canvas.clipPath(roundPath(rect, radius));
                      float x = rect.left - rect.width() * 0.65f
                          + phase * rect.width() * 2.3f;
                      canvas.rotate(-18f, rect.centerX(), rect.centerY());
                      paint.setColor(Color.argb(72,255,255,255));
                      canvas.drawRect(
                          x,
                          rect.top - rect.height(),
                          x + rect.width() * 0.28f,
                          rect.bottom + rect.height(),
                          paint
                      );
                      canvas.restore();
                  }

                  private void drawLow(
                      Canvas canvas,
                      RectF rect,
                      float radius
                  ) {
                      paint.setColor(Color.rgb(127,180,239));
                      canvas.drawRoundRect(rect, radius, radius, paint);

                      float breath = (float)(
                          (Math.sin(phase * Math.PI * 2.0) + 1.0) / 2.0
                      );
                      paint.setColor(
                          Color.argb((int)(18 + 35 * breath),255,255,255)
                      );
                      canvas.drawRoundRect(rect, radius, radius, paint);
                  }

                  private void drawHigh(
                      Canvas canvas,
                      RectF rect,
                      float radius
                  ) {
                      paint.setColor(Color.rgb(240,189,134));
                      canvas.drawRoundRect(rect, radius, radius, paint);

                      canvas.save();
                      canvas.clipPath(roundPath(rect, radius));
                      float fast = (phase * 1.75f) % 1f;
                      float x = rect.left - rect.width() * 0.55f
                          + fast * rect.width() * 2.1f;
                      canvas.rotate(-18f, rect.centerX(), rect.centerY());
                      paint.setColor(Color.argb(88,255,255,255));
                      canvas.drawRect(
                          x,
                          rect.top - rect.height(),
                          x + rect.width() * 0.22f,
                          rect.bottom + rect.height(),
                          paint
                      );
                      canvas.restore();
                  }

                  private void drawFlipTransfer(
                      Canvas canvas,
                      float radius
                  ) {
                      RectF from = transferFrom == 0 ? left : right;
                      RectF to = transferTo == 0 ? left : right;

                      float p = Math.max(
                          0f,
                          Math.min(1f, transferProgress)
                      );
                      float eased = p < 0.5f
                          ? 2f * p * p
                          : 1f - (float)Math.pow(-2f * p + 2f, 2f) / 2f;

                      // v1.0.34: perspectiva ligera usando transformaciones
                      // aceleradas por hardware. Evita Camera + saveLayerAlpha,
                      // que provocaban pausas perceptibles en algunos teléfonos.
                      float fromAngle =
                          (transferTo == 1 ? 18f : -18f) * eased;
                      float toAngle =
                          (transferTo == 1 ? 20f : -20f) * (1f - eased);

                      float fromScale = 1f - 0.028f * eased;
                      float toScale = 0.97f + 0.03f * eased;

                      // El origen se mantiene al principio y desaparece
                      // suavemente al final. El destino entra un poco después.
                      if (p < 0.88f) {
                          drawSpeedCardFast(
                              canvas,
                              from,
                              radius,
                              transferFrom,
                              fromAngle,
                              fromScale
                          );
                      }

                      if (p > 0.10f) {
                          float enter = Math.min(
                              1f,
                              Math.max(0f, (p - 0.10f) / 0.90f)
                          );
                          float enterScale =
                              0.94f + (toScale - 0.94f) * enter;
                          float enterAngle = toAngle * (1f - 0.18f * enter);

                          drawSpeedCardFast(
                              canvas,
                              to,
                              radius,
                              transferTo,
                              enterAngle,
                              enterScale
                          );
                      }

                      // Glow sin shadowLayer: dos cápsulas translúcidas
                      // son más baratas y mantienen el aspecto premium.
                      float glowAlpha =
                          (float)Math.sin(Math.PI * Math.min(1f, p));
                      int color = transferTo == 1
                          ? Color.rgb(242,161,76)
                          : Color.rgb(88,164,235);

                      float glowWidth = to.width() * 0.34f;
                      RectF glowOuter = new RectF(
                          to.centerX() - glowWidth * 0.60f,
                          to.bottom - dpv(3f),
                          to.centerX() + glowWidth * 0.60f,
                          to.bottom + dpv(4f)
                      );
                      RectF glowInner = new RectF(
                          to.centerX() - glowWidth * 0.42f,
                          to.bottom - dpv(2f),
                          to.centerX() + glowWidth * 0.42f,
                          to.bottom + dpv(2f)
                      );

                      paint.setStyle(Paint.Style.FILL);
                      paint.clearShadowLayer();
                      paint.setColor(
                          Color.argb(
                              (int)(24f * glowAlpha),
                              Color.red(color),
                              Color.green(color),
                              Color.blue(color)
                          )
                      );
                      canvas.drawRoundRect(
                          glowOuter,
                          dpv(7f),
                          dpv(7f),
                          paint
                      );
                      paint.setColor(
                          Color.argb(
                              (int)(46f * glowAlpha),
                              Color.red(color),
                              Color.green(color),
                              Color.blue(color)
                          )
                      );
                      canvas.drawRoundRect(
                          glowInner,
                          dpv(5f),
                          dpv(5f),
                          paint
                      );
                  }

                  private void drawSpeedCardFast(
                      Canvas canvas,
                      RectF rect,
                      float radius,
                      int speedValue,
                      float angleY,
                      float scale
                  ) {
                      int save = canvas.save();

                      float cx = rect.centerX();
                      float cy = rect.centerY();
                      float perspective =
                          1f - Math.min(0.10f, Math.abs(angleY) / 220f);
                      float skew = angleY / 420f;

                      canvas.translate(cx, cy);
                      canvas.skew(skew, 0f);
                      canvas.scale(scale * perspective, scale, 0f, 0f);
                      canvas.translate(-cx, -cy);

                      if (speedValue == 0) {
                          drawLow(canvas, rect, radius);
                      } else {
                          drawHigh(canvas, rect, radius);
                      }

                      canvas.restoreToCount(save);
                  }

                  private void drawPendingTarget(
                      Canvas canvas,
                      RectF rect,
                      float radius,
                      int target
                  ) {
                      float pulse = (float)(
                          (Math.sin(phase * Math.PI * 2.0) + 1.0) / 2.0
                      );
                      int color = target == 1
                          ? Color.rgb(245,163,78)
                          : Color.rgb(90,166,239);

                      paint.clearShadowLayer();
                      paint.setStyle(Paint.Style.STROKE);
                      paint.setStrokeWidth(dpv(4f));
                      paint.setColor(
                          Color.argb(
                              (int)(26 + 32 * pulse),
                              Color.red(color),
                              Color.green(color),
                              Color.blue(color)
                          )
                      );
                      canvas.drawRoundRect(
                          rect,
                          radius,
                          radius,
                          paint
                      );
                      paint.setStrokeWidth(dpv(2f));
                      paint.setColor(
                          Color.argb(
                              (int)(95 + 100 * pulse),
                              Color.red(color),
                              Color.green(color),
                              Color.blue(color)
                          )
                      );
                      canvas.drawRoundRect(
                          rect,
                          radius,
                          radius,
                          paint
                      );
                      paint.setStyle(Paint.Style.FILL);
                  }

                  private Path roundPath(RectF rect, float radius) {
                      Path path = new Path();
                      path.addRoundRect(
                          rect,
                          radius,
                          radius,
                          Path.Direction.CW
                      );
                      return path;
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      if (loop != null) loop.cancel();
                      if (selectAnimator != null) selectAnimator.cancel();
                      if (transferAnimator != null) transferAnimator.cancel();
                      super.onDetachedFromWindow();
                  }
              }

              public static class PowerRingView extends FrameLayout {
                  public static final int MODE_SYNC = 0;
                  public static final int MODE_OFF = 1;
                  public static final int MODE_SOAK = 2;
                  public static final int MODE_ON = 3;
                  public static final int MODE_PENDING = 4;
                  public static final int MODE_OFFLINE = 5;
                  public static final int MODE_FAN = 6;
                  public static final int MODE_OFFING = 7;
                  public static final int MODE_SPEED = 8;

                  private final WebView web;
                  private final View touchSurface;
                  private int mode = MODE_SYNC;
                  private boolean highSpeed = false;
                  private long soakRemaining = 120L;
                  private boolean pageReady = false;

                  public PowerRingView(Context context) {
                      super(context);
                      setClipChildren(false);
                      setClipToPadding(false);
                      setClickable(true);
                      setFocusable(true);

                      web = new WebView(context);
                      web.setBackgroundColor(Color.TRANSPARENT);
                      web.setVerticalScrollBarEnabled(false);
                      web.setHorizontalScrollBarEnabled(false);
                      web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      web.getSettings().setJavaScriptEnabled(true);
                      web.getSettings().setDomStorageEnabled(false);
                      web.getSettings().setAllowFileAccess(true);
                      web.getSettings().setAllowContentAccess(false);
                      web.setFocusable(false);
                      web.setClickable(false);
                      web.setLongClickable(false);
                      web.setOnTouchListener((v, event) -> true);
                      web.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(
                              WebView view,
                              String url
                          ) {
                              pageReady = true;
                              pushState();
                          }
                      });

                      addView(
                          web,
                          new FrameLayout.LayoutParams(
                              LayoutParams.MATCH_PARENT,
                              LayoutParams.MATCH_PARENT
                          )
                      );

                      touchSurface = new View(context);
                      touchSurface.setBackgroundColor(Color.TRANSPARENT);
                      touchSurface.setClickable(true);
                      touchSurface.setLongClickable(true);
                      addView(
                          touchSurface,
                          new FrameLayout.LayoutParams(
                              LayoutParams.MATCH_PARENT,
                              LayoutParams.MATCH_PARENT
                          )
                      );

                      web.loadUrl(
                          "file:///android_asset/airesmart/power_visual.html"
                      );
                  }

                  @Override
                  public void setOnClickListener(OnClickListener listener) {
                      if (touchSurface != null) {
                          touchSurface.setOnClickListener(listener);
                      } else {
                          super.setOnClickListener(listener);
                      }
                  }

                  @Override
                  public void setOnLongClickListener(
                      OnLongClickListener listener
                  ) {
                      if (touchSurface != null) {
                          touchSurface.setOnLongClickListener(listener);
                      } else {
                          super.setOnLongClickListener(listener);
                      }
                  }

                  @Override
                  public void setOnTouchListener(OnTouchListener listener) {
                      if (touchSurface != null) {
                          touchSurface.setOnTouchListener(listener);
                      } else {
                          super.setOnTouchListener(listener);
                      }
                  }

                  public void setHighSpeed(boolean high) {
                      if (highSpeed == high) return;
                      highSpeed = high;
                      pushState();
                  }

                  public void setMode(int newMode) {
                      // v1.0.34: no reenviar el mismo modo. Repetir setMode(speed)
                      // reiniciaba los keyframes CSS del WebView con cada paquete MQTT.
                      if (mode == newMode) return;
                      mode = newMode;
                      pushState();
                  }

                  public void setSoakRemaining(long remainingSeconds) {
                      soakRemaining = Math.max(
                          0L,
                          Math.min(120L, remainingSeconds)
                      );
                      mode = MODE_SOAK;

                      if (!pageReady) return;

                      web.evaluateJavascript(
                          "window.AireSmartPower&&" +
                          "window.AireSmartPower.setSoakRemaining(" +
                          soakRemaining +
                          ")",
                          null
                      );
                  }

                  public void flashSuccess() {
                      if (!pageReady) return;
                      web.evaluateJavascript(
                          "window.AireSmartPower&&" +
                          "window.AireSmartPower.flashSuccess()",
                          null
                      );
                  }

                  private String visualState() {
                      switch (mode) {
                          case MODE_OFF:
                              return "off";
                          case MODE_SOAK:
                              return "soak";
                          case MODE_ON:
                              return highSpeed ? "high" : "low";
                          case MODE_FAN:
                              return highSpeed ? "fanHigh" : "fanLow";
                          case MODE_PENDING:
                              return "pending";
                          case MODE_OFFLINE:
                              return "offline";
                          case MODE_OFFING:
                              return "offing";
                          case MODE_SPEED:
                              return "speed";
                          default:
                              return "sync";
                      }
                  }

                  private void pushState() {
                      if (!pageReady) return;

                      if (mode == MODE_SOAK) {
                          web.evaluateJavascript(
                              "window.AireSmartPower&&" +
                              "window.AireSmartPower.setSoakRemaining(" +
                              soakRemaining +
                              ")",
                              null
                          );
                          return;
                      }

                      String state = visualState();
                      web.evaluateJavascript(
                          "window.AireSmartPower&&" +
                          "window.AireSmartPower.setMode('" +
                          state +
                          "')",
                          null
                      );
                  }

                  @Override
                  protected void onDetachedFromWindow() {
                      if (web != null) {
                          web.stopLoading();
                      }
                      super.onDetachedFromWindow();
                  }
              }
          }
          EOF

      - name: Build permanently signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename signed APK
        run: cp app/build/outputs/apk/release/app-release.apk AireSmart_Remote_v1.0.34_Stable_Visual_State_Lock.apk

      - name: Verify APK signature
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify             --verbose             --print-certs             AireSmart_Remote_v1.0.34_Stable_Visual_State_Lock.apk

      - name: Generate in-app update manifest
        shell: bash
        run: |
          set -euo pipefail

          APK="AireSmart_Remote_v1.0.34_Stable_Visual_State_Lock.apk"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"

          cat > latest.json <<EOF
          {
            "versionCode": 38,
            "versionName": "1.0.34",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.34/${APK}",
            "sha256": "${SHA256}",
            "notes": "Stable Visual State Lock: CAMBIANDO se mantiene hasta estado final estable; APAGADO transitorio no reinicia animaciones."
          }
          EOF

      - name: Publish permanent AireSmart release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v1.0.34"
          APK="AireSmart_Remote_v1.0.34_Stable_Visual_State_Lock.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload \
              "$TAG" \
              "$APK" \
              latest.json \
              --clobber
          else
            gh release create \
              "$TAG" \
              "$APK" \
              latest.json \
              --title "AireSmart Remote v1.0.34" \
              --notes "AireSmart v1.0.34: Stable Visual State Lock; ignora APAGADO transitorio durante cambio BAJA/ALTA y evita reinicios de animación."
          fi

          # Fuerza esta release como la Latest Release de GitHub.
          gh release edit "$TAG" --latest

      - name: Remove decrypted key
        if: always()
        shell: bash
        run: rm -f /tmp/airesmart-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AireSmart-Remote-v1.0.34-Stable-Visual-State-Lock
          path: |
            AireSmart_Remote_v1.0.34_Stable_Visual_State_Lock.apk
            latest.json
