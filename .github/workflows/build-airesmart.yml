name: Build AireSmart APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-airesmart.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/airesmart/remote
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AireSmartRemote"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.airesmart.remote'
              compileSdk 35

              defaultConfig {
                  applicationId "com.airesmart.remote"
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName "1.0.4"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ""
                      versionNameSuffix ""
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources> <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar"> <item name="android:fontFamily">sans</item> <item name="android:windowLightStatusBar">false</item> <item name="android:statusBarColor">#171A20</item> <item name="android:navigationBarColor">#171A20</item> <item name="android:colorAccent">#2F8CFF</item> <item name="android:windowBackground">#E9EDF2</item> </style> </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"> <uses-permission android:name="android.permission.INTERNET" /> <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" /> <application android:allowBackup="false" android:label="AireSmart" android:usesCleartextTraffic="false" android:theme="@style/AppTheme"> <activity android:name=".MainActivity" android:exported="true"> <intent-filter> <action android:name="android.intent.action.MAIN" /> <category android:name="android.intent.category.LAUNCHER" /> </intent-filter> </activity> </application> </manifest>
          EOF

          cat > app/src/main/java/com/airesmart/remote/MainActivity.java <<'EOF'
          package com.airesmart.remote;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.content.SharedPreferences;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.eclipse.paho.client.mqttv3.IMqttDeliveryToken;
          import org.eclipse.paho.client.mqttv3.MqttCallbackExtended;
          import org.eclipse.paho.client.mqttv3.MqttClient;
          import org.eclipse.paho.client.mqttv3.MqttConnectOptions;
          import org.eclipse.paho.client.mqttv3.MqttException;
          import org.eclipse.paho.client.mqttv3.MqttMessage;
          import org.eclipse.paho.client.mqttv3.persist.MemoryPersistence;
          import org.json.JSONObject;

          import java.nio.charset.StandardCharsets;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private MqttClient mqtt;
              private TextView cloudStatus, systemState, detailState, ackState, heroSub;
              private Button powerButton, lowButton, highButton;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private SharedPreferences prefs;

              private String host = "x10cd1d1.ala.us-east-1.emqxsl.com";
              private int port = 8883;
              private String username = "airesmart_remote_001";
              private String password = "";
              private String topicBase = "airesmart/001";
              private boolean motorOn = false;
              private boolean high = false;
              private boolean systemActive = false;
              private boolean deviceSeen = false;
              private String pendingId = null;
              private final Runnable ackTimeout = () -> {
                  if (pendingId != null) {
                      ackState.setText("SIN CONFIRMACIÓN · revisa conexión");
                      pendingId = null;
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("airesmart", MODE_PRIVATE);
                  host = prefs.getString("host", host);
                  port = prefs.getInt("port", port);
                  username = prefs.getString("username", username);
                  password = prefs.getString("password", "");
                  topicBase = prefs.getString("topicBase", topicBase);
                  setContentView(buildUi());
                  if (password.isEmpty()) showConnectionDialog(); else connectMqtt();
              }

              private View buildUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(Color.rgb(232,236,241));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(22), dp(24), dp(22), dp(30));
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  scroll.addView(root, new ScrollView.LayoutParams(-1,-1));

                  TextView title = text("AireSmart", 31, Color.rgb(27,31,38), true);
                  title.setOnLongClickListener(v -> { showConnectionDialog(); return true; });
                  root.addView(title);
                  TextView sub = text("CONTROL REMOTO", 12, Color.rgb(103,111,122), true);
                  root.addView(sub);
                  space(root, 18);

                  LinearLayout statusCard = card();
                  cloudStatus = text("● DESCONECTADO", 14, Color.rgb(211,63,63), true);
                  statusCard.addView(cloudStatus);
                  detailState = text("Configura MQTT para comenzar", 13, Color.rgb(98,106,116), false);
                  statusCard.addView(detailState);
                  root.addView(statusCard);
                  space(root, 18);

                  LinearLayout hero = card();
                  hero.setGravity(Gravity.CENTER);
                  systemState = text("SINCRONIZANDO…", 27, Color.rgb(90,99,112), true);
                  systemState.setGravity(Gravity.CENTER);
                  hero.addView(systemState);
                  heroSub = text("Esperando estado del AireSmart", 14, Color.rgb(97,104,114), false);
                  heroSub.setGravity(Gravity.CENTER);
                  hero.addView(heroSub);
                  root.addView(hero);
                  space(root, 18);

                  powerButton = button("ENCENDER", Color.rgb(38,155,90));
                  powerButton.setOnClickListener(v -> sendPower(!systemActive));
                  root.addView(powerButton, lp(-1,56));
                  space(root, 12);

                  LinearLayout speeds = new LinearLayout(this);
                  speeds.setOrientation(LinearLayout.HORIZONTAL);
                  lowButton = button("BAJA", Color.rgb(58,101,173));
                  highButton = button("ALTA", Color.rgb(240,139,42));
                  lowButton.setOnClickListener(v -> sendSpeed(false));
                  highButton.setOnClickListener(v -> sendSpeed(true));
                  speeds.addView(lowButton, new LinearLayout.LayoutParams(0, dp(54), 1));
                  spaceHorizontal(speeds, 10);
                  speeds.addView(highButton, new LinearLayout.LayoutParams(0, dp(54), 1));
                  root.addView(speeds, lp(-1,54));
                  space(root, 16);

                  ackState = text("LISTO", 13, Color.rgb(92,100,110), false);
                  root.addView(ackState);
                  space(root, 18);

                  TextView adminHint = text("Mantén presionado ‘AireSmart’ para configuración", 11, Color.rgb(135,142,151), false);
                  root.addView(adminHint);

                  TextView version = text("AireSmart Remote v1.0.4", 11, Color.rgb(125,132,141), false);
                  version.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams vp = lp(-1,-2); vp.topMargin=dp(24);
                  root.addView(version, vp);
                  return scroll;
              }

              private void showConnectionDialog() {
                  LinearLayout form = new LinearLayout(this);
                  form.setOrientation(LinearLayout.VERTICAL);
                  form.setPadding(dp(18), 0, dp(18), 0);
                  EditText hostEt = field("Broker", host, false);
                  EditText portEt = field("Puerto", String.valueOf(port), false);
                  portEt.setInputType(InputType.TYPE_CLASS_NUMBER);
                  EditText userEt = field("Usuario", username, false);
                  EditText passEt = field("Contraseña MQTT", password, true);
                  EditText topicEt = field("Topic base", topicBase, false);
                  form.addView(hostEt); form.addView(portEt); form.addView(userEt); form.addView(passEt); form.addView(topicEt);

                  new AlertDialog.Builder(this)
                      .setTitle("Conectar AireSmart")
                      .setMessage("Configuración de administrador · usa el usuario remoto de AireSmart.")
                      .setView(form)
                      .setNegativeButton("CANCELAR", null)
                      .setPositiveButton("CONECTAR", (d,w) -> {
                          host = hostEt.getText().toString().trim();
                          try { port = Integer.parseInt(portEt.getText().toString().trim()); } catch(Exception e) { port = 8883; }
                          username = userEt.getText().toString().trim();
                          password = passEt.getText().toString();
                          topicBase = topicEt.getText().toString().trim();
                          if (password.isEmpty()) {
                              toast("Falta la contraseña MQTT");
                              return;
                          }
                          prefs.edit()
                              .putString("host", host)
                              .putInt("port", port)
                              .putString("username", username)
                              .putString("password", password)
                              .putString("topicBase", topicBase)
                              .apply();
                          connectMqtt();
                      }).show();
              }

              private void connectMqtt() {
                  setCloud("● CONECTANDO", Color.rgb(236,143,34));
                  detailState.setText("Conectando al servicio remoto…");
                  deviceSeen = false;
                  systemState.setText("SINCRONIZANDO…");
                  systemState.setTextColor(Color.rgb(90,99,112));
                  heroSub.setText("Esperando estado del AireSmart");
                  io.execute(() -> {
                      try {
                          if (mqtt != null) {
                              try { if (mqtt.isConnected()) mqtt.disconnect(); } catch(Exception ignored) {}
                              try { mqtt.close(); } catch(Exception ignored) {}
                          }
                          String uri = "ssl://" + host + ":" + port;
                          mqtt = new MqttClient(uri, "airesmart_app_" + UUID.randomUUID().toString().substring(0,8), new MemoryPersistence());
                          mqtt.setCallback(new MqttCallbackExtended() {
                              public void connectComplete(boolean reconnect, String serverURI) {
                                  runOnUiThread(() -> {
                                      setCloud("● BROKER CONECTADO", Color.rgb(29,157,91));
                                      detailState.setText(reconnect ? "Conexión recuperada · sincronizando" : "Conectado · sincronizando AireSmart");
                                  });
                                  subscribeTopics();
                              }
                              public void connectionLost(Throwable cause) {
                                  runOnUiThread(() -> {
                                      setCloud("● DESCONECTADO", Color.rgb(211,63,63));
                                      detailState.setText(cause == null ? "Conexión perdida" : cause.getMessage());
                                  });
                              }
                              public void messageArrived(String topic, MqttMessage message) {
                                  handleMessage(topic, new String(message.getPayload(), StandardCharsets.UTF_8));
                              }
                              public void deliveryComplete(IMqttDeliveryToken token) {}
                          });
                          MqttConnectOptions o = new MqttConnectOptions();
                          o.setUserName(username);
                          o.setPassword(password.toCharArray());
                          o.setAutomaticReconnect(true);
                          o.setCleanSession(true);
                          o.setConnectionTimeout(12);
                          o.setKeepAliveInterval(45);
                          mqtt.connect(o);
                      } catch(Exception e) {
                          runOnUiThread(() -> {
                              setCloud("● ERROR", Color.rgb(211,63,63));
                              detailState.setText(e.getClass().getSimpleName() + ": " + safe(e.getMessage()));
                          });
                      }
                  });
              }

              private void subscribeTopics() {
                  io.execute(() -> {
                      try {
                          mqtt.subscribe(topicBase + "/state", 1);
                          mqtt.subscribe(topicBase + "/ack", 1);
                          mqtt.subscribe(topicBase + "/status", 1);
                      } catch(Exception e) {
                          runOnUiThread(() -> {
                              setCloud("● ERROR DE SUSCRIPCIÓN", Color.rgb(211,63,63));
                              detailState.setText(safe(e.getMessage()));
                          });
                      }
                  });
              }

              private void handleMessage(String topic, String payload) {
                  try {
                      JSONObject j = new JSONObject(payload);
                      if (topic.endsWith("/state")) {
                          deviceSeen = true;
                          motorOn = j.optBoolean("motor", false);
                          high = j.optBoolean("high", false);
                          String state = j.optString("state", motorOn ? "ENCENDIDO" : "APAGADO");
                          long soak = j.optLong("soakRemaining", 0);
                          runOnUiThread(() -> {
                              setCloud("● AIRESMART EN LÍNEA", Color.rgb(29,157,91));
                              detailState.setText("Estado sincronizado");
                              paintState(state, soak);
                          });
                      } else if (topic.endsWith("/status")) {
                          boolean online = j.optBoolean("online", false);
                          deviceSeen = online;
                          runOnUiThread(() -> {
                              setCloud(online ? "● AIRESMART EN LÍNEA" : "● AIRESMART OFFLINE", online ? Color.rgb(29,157,91) : Color.rgb(211,63,63));
                              detailState.setText(online ? "Dispositivo conectado" : "Dispositivo sin conexión");
                          });
                      } else if (topic.endsWith("/ack")) {
                          String id = j.optString("id", "");
                          if (pendingId != null && !pendingId.equals(id)) return;
                          mainHandler.removeCallbacks(ackTimeout);
                          pendingId = null;
                          boolean accepted = j.optBoolean("accepted", false);
                          String result = j.optString("result", accepted ? "accepted" : "rejected");
                          motorOn = j.optBoolean("motor", motorOn);
                          high = j.optBoolean("high", high);
                          String state = j.optString("state", motorOn ? "ENCENDIDO" : "APAGADO");
                          runOnUiThread(() -> {
                              ackState.setText(accepted ? "ORDEN CONFIRMADA" : "ORDEN RECHAZADA · " + friendlyResult(result));
                              paintState(state, 0);
                          });
                      }
                  } catch(Exception e) {
                      runOnUiThread(() -> ackState.setText("MENSAJE MQTT NO VÁLIDO"));
                  }
              }

              private String friendlyResult(String result) {
                  if ("already_on_or_starting".equals(result)) return "ya estaba encendido";
                  if ("already_off".equals(result)) return "ya estaba apagado";
                  if ("already_low".equals(result)) return "ya estaba en baja";
                  if ("already_high".equals(result)) return "ya estaba en alta";
                  if ("not_ready".equals(result)) return "espera a que termine el remojo";
                  if ("duplicate_ignored".equals(result)) return "orden duplicada";
                  return result == null || result.isEmpty() ? "sin detalle" : result;
              }

              private void sendPower(boolean on) {
                  sendCommand("power", on ? "true" : "false", true);
              }

              private void sendSpeed(boolean makeHigh) {
                  sendCommand("speed", makeHigh ? "high" : "low", false);
              }

              private void sendCommand(String action, String value, boolean boolValue) {
                  if (mqtt == null || !mqtt.isConnected()) { toast("AireSmart no está conectado"); return; }
                  String id = System.currentTimeMillis() + "-" + UUID.randomUUID().toString().substring(0,6);
                  String json = boolValue
                      ? "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":"+value+"}"
                      : "{\"id\":\""+id+"\",\"action\":\""+action+"\",\"value\":\""+value+"\"}";
                  pendingId = id;
                  ackState.setText("ENVIANDO ORDEN…");
                  mainHandler.removeCallbacks(ackTimeout);
                  mainHandler.postDelayed(ackTimeout, 8000);
                  io.execute(() -> {
                      try {
                          MqttMessage m = new MqttMessage(json.getBytes(StandardCharsets.UTF_8));
                          m.setQos(1); m.setRetained(false);
                          mqtt.publish(topicBase + "/cmd", m);
                      } catch(Exception e) {
                          runOnUiThread(() -> {
                              mainHandler.removeCallbacks(ackTimeout);
                              pendingId = null;
                              ackState.setText("ERROR AL ENVIAR · " + safe(e.getMessage()));
                          });
                      }
                  });
              }

              private void paintState(String state, long soak) {
                  String upper = state == null ? "--" : state.toUpperCase();
                  systemActive = soak > 0 || !upper.contains("APAGADO");
                  if (soak > 0 || upper.contains("REMOJ")) {
                      systemState.setText("REMOJANDO");
                      systemState.setTextColor(Color.rgb(41,135,218));
                      heroSub.setText(soak > 0 ? "Preparando enfriamiento · " + soak + " s" : "Preparando enfriamiento");
                  } else if (motorOn || upper.contains("ENCENDIDO")) {
                      systemState.setText(high ? "ENCENDIDO · ALTA" : "ENCENDIDO · BAJA");
                      systemState.setTextColor(Color.rgb(27,151,88));
                      heroSub.setText("Funcionando correctamente");
                      systemActive = true;
                  } else {
                      systemState.setText("APAGADO");
                      systemState.setTextColor(Color.rgb(210,57,57));
                      heroSub.setText("Equipo en espera");
                      systemActive = false;
                  }
                  powerButton.setText(systemActive ? "APAGAR" : "ENCENDER");
                  powerButton.setBackground(bg(systemActive ? Color.rgb(207,61,61) : Color.rgb(38,155,90), 14));
                  lowButton.setEnabled(motorOn);
                  highButton.setEnabled(motorOn);
                  lowButton.setAlpha(motorOn ? 1f : 0.55f);
                  highButton.setAlpha(motorOn ? 1f : 0.55f);
              }

              private void setCloud(String txt, int color) { cloudStatus.setText(txt); cloudStatus.setTextColor(color); }
              private String safe(String s) { return s == null ? "sin detalle" : s; }
              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              private TextView text(String s, int sp, int color, boolean bold) {
                  TextView v = new TextView(this); v.setText(s); v.setTextSize(sp); v.setTextColor(color); v.setGravity(Gravity.CENTER_HORIZONTAL);
                  if (bold) v.setTypeface(v.getTypeface(), android.graphics.Typeface.BOLD); return v;
              }
              private LinearLayout card() {
                  LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); l.setPadding(dp(20),dp(18),dp(20),dp(18));
                  l.setBackground(bg(Color.WHITE,18)); l.setElevation(dp(2)); return l;
              }
              private Button button(String s, int color) {
                  Button b = new Button(this); b.setText(s); b.setTextColor(Color.WHITE); b.setTextSize(15); b.setTypeface(b.getTypeface(), android.graphics.Typeface.BOLD);
                  b.setBackground(bg(color,14)); b.setAllCaps(false); return b;
              }
              private EditText field(String hint, String value, boolean secret) {
                  EditText e = new EditText(this); e.setHint(hint); e.setText(value); e.setSingleLine(true); e.setTextSize(15);
                  if(secret) e.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  LinearLayout.LayoutParams p=lp(-1,54); p.bottomMargin=dp(6); e.setLayoutParams(p); return e;
              }
              private GradientDrawable bg(int color, int radius) { GradientDrawable g=new GradientDrawable(); g.setColor(color); g.setCornerRadius(dp(radius)); return g; }
              private void space(LinearLayout l,int h){ View v=new View(this); l.addView(v,new LinearLayout.LayoutParams(1,dp(h))); }
              private void spaceHorizontal(LinearLayout l,int w){ View v=new View(this); l.addView(v,new LinearLayout.LayoutParams(dp(w),1)); }
              private LinearLayout.LayoutParams lp(int w,int h){ return new LinearLayout.LayoutParams(w, h<0?h:dp(h)); }
              private int dp(int v){ return Math.round(v*getResources().getDisplayMetrics().density); }

              @Override protected void onDestroy() {
                  super.onDestroy();
                  io.execute(() -> { try { if(mqtt!=null){ if(mqtt.isConnected()) mqtt.disconnect(); mqtt.close(); } } catch(Exception ignored){} });
              }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AireSmart_Remote_v1.0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AireSmart-Remote-v1.0.4
          path: AireSmart_Remote_v1.0.4.apk
