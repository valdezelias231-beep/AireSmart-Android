                          return;
                      }

                      repairButton.setEnabled(false);
                      repairButton.setAlpha(0.65f);
                      status.setText("REPARANDO IDENTIDAD…");
                      status.setTextColor(Color.rgb(235,130,38));

                      repairIdentity(
