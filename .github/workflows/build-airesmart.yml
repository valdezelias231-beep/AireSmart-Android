          const root=document.documentElement, wrap=document.getElementById('wrap'), fill=document.getElementById('soakFill');
          const C=2*Math.PI*33.5;
          fill.style.strokeDasharray=`${C} ${C}`;
          fill.style.strokeDashoffset=C;
          let soakRAF=0, soakStart=0, soakFrom=0, soakDuration=0;
          const cfg={
            sync:{cls:'state-sync',color:'#5c7088',o1:'2.4s',o2:'3.2s'},
            offline:{cls:'state-offline',color:'#8494a7',o1:'4s',o2:'5s'},
            off:{cls:'state-off',color:'#e44a5a',o1:'2.6s',o2:'3.5s'},
            offing:{cls:'state-offing',color:'#e44a5a',o1:'2.6s',o2:'3.5s'},
            soak:{cls:'state-soak',color:'#4aa8ff',o1:'2.6s',o2:'3.5s'},
            low:{cls:'state-on-low',color:'#36c978',o1:'2.6s',o2:'3.6s'},
            high:{cls:'state-on-high',color:'#36c978',o1:'1.2s',o2:'1.85s'},
            fanLow:{cls:'state-fan-low',color:'#20b7c9',o1:'2.6s',o2:'3.6s'},
            fanHigh:{cls:'state-fan-high',color:'#20b7c9',o1:'1.2s',o2:'1.85s'},
            speed:{cls:'state-speed',color:'#ff9f3d',o1:'1s',o2:'1.55s'},
            pending:{cls:'state-pending',color:'#f0a11e',o1:'.9s',o2:'1.35s'}
          };
          let currentVisualState='';
          function apply(name){
            const s=cfg[name]||cfg.sync;
            root.style.setProperty('--state',s.color);
            root.style.setProperty('--orbit1',s.o1);
            root.style.setProperty('--orbit2',s.o2);
            // v1.0.34: MQTT puede repetir el mismo estado varias veces.
            // No reasignar la clase evita reiniciar keyframes que ya están corriendo.
            if(currentVisualState===name)return;
            currentVisualState=name;
            wrap.className='wrap '+s.cls;
          }
          function setProgress(p){
            p=Math.max(0,Math.min(1,p));
            fill.style.strokeDashoffset=C*(1-p);
            wrap.classList.toggle('active',p>.04);
            wrap.classList.toggle('mid',p>=.35);
            wrap.classList.toggle('high',p>=.70);
          }
          function animateSoak(from,remaining){
            cancelAnimationFrame(soakRAF);
            soakFrom=Math.max(0,Math.min(1,from));
            soakDuration=Math.max(0,remaining*1000);
            soakStart=performance.now();
            setProgress(soakFrom);
            if(soakDuration<=0){setProgress(1);return}
            const tick=t=>{
              const k=Math.min(1,(t-soakStart)/soakDuration);
              setProgress(soakFrom+(1-soakFrom)*k);
              if(k<1)soakRAF=requestAnimationFrame(tick);
            };
            soakRAF=requestAnimationFrame(tick);
          }
          window.AireSmartPower={
            setMode(name){cancelAnimationFrame(soakRAF);apply(name);if(name!=='soak')setProgress(0)},
            setSoakRemaining(rem){apply('soak');const r=Math.max(0,Math.min(120,Number(rem)||0));animateSoak(1-r/120,r)},
            flashSuccess(){wrap.classList.remove('flash');void wrap.offsetWidth;wrap.classList.add('flash');setTimeout(()=>wrap.classList.remove('flash'),650)}
          };
          apply('sync');
          </script>
