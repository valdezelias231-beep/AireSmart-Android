              private long getInstalledVersionCode() {
                  try {
                      android.content.pm.PackageInfo info =
                          getPackageManager().getPackageInfo(
                              getPackageName(),
                              0
                          );

                      if (
                          android.os.Build.VERSION.SDK_INT >=
                          android.os.Build.VERSION_CODES.P
                      ) {
                          return info.getLongVersionCode();
                      }

                      return info.versionCode;

                  } catch (Exception ignored) {
                      return 0L;
                  }
              }

              private void hideUpdateCard() {
                  runOnUiThread(() -> {
                      if (updateCard != null) {
                          updateCard.setVisibility(View.GONE);
                      }
                  });
              }

              private void checkForUpdates() {
                  hideUpdateCard();

                  io.execute(() -> {
                      try {
                          String raw = fetchHttpsText(
                              UPDATE_MANIFEST_URL
                          );

                          if (raw == null || raw.trim().isEmpty()) {
                              return;
                          }

                          JSONObject latest = new JSONObject(raw);

                          int latestCode =
                              latest.optInt("versionCode", 0);

                          String latestName =
                              latest.optString(
                                  "versionName",
                                  ""
                              ).trim();

                          String apkUrl =
                              latest.optString(
                                  "apkUrl",
                                  ""
                              ).trim();

                          String sha256 =
                              latest.optString(
                                  "sha256",
                                  ""
                              ).trim().toLowerCase();

                          String notes =
                              latest.optString(
                                  "notes",
                                  ""
                              ).trim();

                          long installedCode =
                              getInstalledVersionCode();

                          if (
                              latestCode <= 0 ||
                              latestName.isEmpty() ||
                              apkUrl.isEmpty() ||
                              sha256.length() != 64
                          ) {
                              hideUpdateCard();
                              return;
                          }

                          if (
                              installedCode > 0 &&
                              latestCode <= installedCode
                          ) {
                              availableUpdateVersion = "";
                              availableUpdateApkUrl = "";
                              availableUpdateSha256 = "";
                              hideUpdateCard();
                              return;
                          }

                          availableUpdateVersion = latestName;
                          availableUpdateApkUrl = apkUrl;
                          availableUpdateSha256 = sha256;

                          runOnUiThread(() -> {
                              if (updateCard == null) {
                                  return;
                              }

                              updateTitle.setText(
                                  "ACTUALIZACIÓN DISPONIBLE · v" +
                                  availableUpdateVersion
                              );

                              updateDetail.setText(
                                  notes.isEmpty()
                                      ? "Nueva versión de AireSmart lista para instalar."
                                      : notes
                              );

                              updateButton.setText("ACTUALIZAR");
                              updateButton.setEnabled(true);
                              updateButton.setAlpha(1f);
                              updateCard.setVisibility(View.VISIBLE);
                          });

                      } catch (Exception ignored) {
                          // Si GitHub no responde, la app sigue funcionando
                          // normalmente y simplemente oculta el aviso.
                      }
                  });
              }

              private String fetchHttpsText(String initialUrl)
                  throws Exception {

                  String currentUrl = initialUrl;

                  for (int redirect = 0; redirect < 6; redirect++) {
                      URL url = new URL(currentUrl);

                      HttpsURLConnection conn =
                          (HttpsURLConnection) url.openConnection();

                      conn.setRequestMethod("GET");
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(12000);
                      conn.setUseCaches(false);
                      conn.setInstanceFollowRedirects(false);
                      conn.setRequestProperty(
                          "Accept",
                          "application/json"
                      );
                      conn.setRequestProperty(
                          "User-Agent",
                          "AireSmart-Android/" + "1.0.24"
                      );

                      int code = conn.getResponseCode();

                      if (
                          code == 301 ||
                          code == 302 ||
                          code == 303 ||
                          code == 307 ||
                          code == 308
                      ) {
                          String location =
                              conn.getHeaderField("Location");

                          conn.disconnect();

                          if (
                              location == null ||
                              location.trim().isEmpty()
                          ) {
                              throw new IllegalStateException(
                                  "update_redirect_without_location"
                              );
                          }

                          currentUrl = new URL(
                              url,
                              location
                          ).toString();

                          continue;
                      }

                      if (code < 200 || code >= 300) {
                          conn.disconnect();
                          throw new IllegalStateException(
                              "update_manifest_http_" + code
                          );
                      }

                      StringBuilder result =
                          new StringBuilder();

                      try (
                          BufferedReader reader =
                              new BufferedReader(
                                  new InputStreamReader(
                                      conn.getInputStream(),
                                      StandardCharsets.UTF_8
                                  )
                              )
                      ) {
                          String line;

                          while ((line = reader.readLine()) != null) {
                              result.append(line);
                          }
                      } finally {
                          conn.disconnect();
                      }

                      return result.toString();
                  }

                  throw new IllegalStateException(
                      "too_many_update_redirects"
                  );
              }

              private void downloadAndInstallUpdate() {
                  if (
                      availableUpdateApkUrl.isEmpty() ||
                      availableUpdateSha256.length() != 64
                  ) {
                      toast("No hay una actualización lista");
                      return;
                  }

                  if (
                      Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      !getPackageManager().canRequestPackageInstalls()
                  ) {
                      try {
                          Intent settingsIntent = new Intent(
                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse(
                                  "package:" + getPackageName()
                              )
                          );

                          startActivity(settingsIntent);

                          toast(
                              "Activa “Permitir desde esta fuente” " +
                              "y vuelve a tocar ACTUALIZAR"
                          );
                      } catch (Exception error) {
                          toast(
                              "Android debe permitir instalar " +
                              "actualizaciones desde AireSmart"
                          );
                      }

                      return;
                  }

                  try {
                      DownloadManager manager =
                          (DownloadManager) getSystemService(
                              DOWNLOAD_SERVICE
                          );

                      if (manager == null) {
                          throw new IllegalStateException(
                              "download_manager_unavailable"
                          );
                      }

                      String fileName =
                          "AireSmart_Update_v" +
                          availableUpdateVersion +
                          ".apk";

                      DownloadManager.Request request =
                          new DownloadManager.Request(
                              Uri.parse(
                                  availableUpdateApkUrl
                              )
                          );

                      request.setTitle(
                          "Actualizando AireSmart"
                      );

                      request.setDescription(
                          "Descargando v" +
                          availableUpdateVersion
                      );

                      request.setMimeType(
                          "application/vnd.android.package-archive"
                      );

                      request.setAllowedOverMetered(true);
                      request.setAllowedOverRoaming(false);
                      request.setNotificationVisibility(
                          DownloadManager.Request
                              .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                      );

                      request.setDestinationInExternalFilesDir(
                          this,
                          Environment.DIRECTORY_DOWNLOADS,
                          fileName
                      );

                      long downloadId =
                          manager.enqueue(request);

                      updateButton.setEnabled(false);
                      updateButton.setAlpha(0.7f);
                      updateButton.setText("DESCARGANDO…");
                      updateDetail.setText(
                          "Descargando y verificando la actualización."
                      );

                      io.execute(
                          () -> waitForUpdateDownload(
                              manager,
                              downloadId
                          )
                      );

                  } catch (Exception error) {
                      updateButton.setEnabled(true);
                      updateButton.setAlpha(1f);
                      updateButton.setText("ACTUALIZAR");
                      toast("No se pudo iniciar la descarga");
                  }
              }

              private void waitForUpdateDownload(
                  DownloadManager manager,
                  long downloadId
              ) {
                  for (int attempt = 0; attempt < 240; attempt++) {
                      DownloadManager.Query query =
                          new DownloadManager.Query();

                      query.setFilterById(downloadId);

                      try (
                          android.database.Cursor cursor =
                              manager.query(query)
                      ) {
                          if (
                              cursor != null &&
                              cursor.moveToFirst()
                          ) {
                              int statusIndex =
                                  cursor.getColumnIndex(
                                      DownloadManager.COLUMN_STATUS
                                  );

                              int status =
                                  statusIndex >= 0
                                      ? cursor.getInt(statusIndex)
                                      : DownloadManager.STATUS_FAILED;

                              if (
                                  status ==
                                  DownloadManager.STATUS_SUCCESSFUL
                              ) {
                                  Uri apkUri =
                                      manager.getUriForDownloadedFile(
                                          downloadId
                                      );

                                  if (apkUri == null) {
                                      updateFailed(
                                          "No se pudo abrir el APK descargado"
                                      );
                                      return;
                                  }

                                  try {
                                      String downloadedSha =
                                          sha256OfUri(apkUri);

                                      if (
                                          !availableUpdateSha256.equalsIgnoreCase(
                                              downloadedSha
                                          )
                                      ) {
                                          manager.remove(downloadId);

                                          updateFailed(
                                              "La verificación de seguridad falló"
                                          );
                                          return;
                                      }

                                      runOnUiThread(
                                          () -> installDownloadedApk(
                                              apkUri
                                          )
                                      );

                                  } catch (Exception error) {
                                      updateFailed(
                                          "No se pudo verificar la actualización"
                                      );
                                  }

                                  return;
                              }

                              if (
                                  status ==
                                  DownloadManager.STATUS_FAILED
                              ) {
                                  updateFailed(
                                      "La descarga de la actualización falló"
                                  );
                                  return;
                              }
                          }
                      } catch (Exception error) {
                          updateFailed(
                              "No se pudo comprobar la descarga"
                          );
                          return;
                      }

                      try {
                          Thread.sleep(500);
                      } catch (InterruptedException ignored) {
                          Thread.currentThread().interrupt();
                          return;
                      }
                  }

                  updateFailed(
                      "La descarga tardó demasiado"
                  );
              }

              private String sha256OfUri(Uri uri)
                  throws Exception {

                  MessageDigest digest =
                      MessageDigest.getInstance("SHA-256");

                  try (
                      InputStream input =
                          getContentResolver().openInputStream(uri)
                  ) {
                      if (input == null) {
                          throw new IllegalStateException(
                              "update_file_unavailable"
                          );
                      }

                      byte[] buffer = new byte[8192];
                      int read;

                      while ((read = input.read(buffer)) != -1) {
                          digest.update(
                              buffer,
                              0,
                              read
                          );
                      }
                  }

                  byte[] hash = digest.digest();
                  StringBuilder hex = new StringBuilder();

                  for (byte b : hash) {
                      hex.append(
                          String.format(
                              "%02x",
                              b & 0xff
                          )
                      );
                  }

                  return hex.toString();
              }

              private void installDownloadedApk(Uri apkUri) {
                  try {
                      updateButton.setText("INSTALANDO…");
                      updateDetail.setText(
                          "Android abrirá el instalador para confirmar."
                      );

                      Intent install = new Intent(
                          Intent.ACTION_VIEW
                      );

                      install.setDataAndType(
                          apkUri,
                          "application/vnd.android.package-archive"
                      );

                      install.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK |
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      );

                      startActivity(install);

                  } catch (Exception error) {
                      updateFailed(
                          "No se pudo abrir el instalador de Android"
                      );
                  }
              }

