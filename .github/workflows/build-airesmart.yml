          cat > app/src/main/assets/airesmart/ui.js <<'EOF'
          (()=>{
            let frames=0,start=performance.now(),sampled=false;
            function frame(t){
              frames++;
              if(!sampled && t-start>=2600){
                const fps=Math.round(frames*1000/(t-start));
                if(fps<48) document.body.classList.add('lite');
                sampled=true;
                const m=document.getElementById('visualMode');
                if(m) m.textContent=document.body.classList.contains('lite')?'Visual ligero':'Visual premium';
              }
              if(!sampled) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
            window.AireSmartUI={
              setLite(v){document.body.classList.toggle('lite',!!v)},
              haptic(){try{if(window.AireSmartNative)window.AireSmartNative.haptic()}catch(e){}}
            };
          })();
          EOF

          cat > app/src/main/assets/airesmart/bridge.js <<'EOF'
          (()=>{
            let snapshot={connected:false,events:[]};
            let filter='all';
            const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const fmtTime=ts=>{try{return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}catch(e){return '--:--:--'}};
            const levelClass=e=>e.level==='error'?'bad':e.level==='warn'?'warn':e.level==='ok'?'ok':'info';
            function filtered(){return (snapshot.events||[]).filter(e=>filter==='all'||e.type===filter||(filter==='error'&&e.level==='error'));}
            function render(){
              const conn=document.getElementById('connText'), dot=document.getElementById('connDot');
              conn.textContent=snapshot.connected?'Conectado':'Sin conexión'; dot.className='signal '+(snapshot.connected?'ok':'bad');
              document.getElementById('ackCount').textContent=snapshot.ackCount||0;
              document.getElementById('errorCount').textContent=snapshot.errorCount||0;
              document.getElementById('avgLatency').textContent=(snapshot.avgLatencyMs||0);
              const list=filtered(); document.getElementById('eventCount').textContent=list.length+' evento'+(list.length===1?'':'s');
              const root=document.getElementById('timeline');
              if(!list.length){root.innerHTML='<div class="empty">Todavía no hay eventos en este filtro.</div>';return}
              root.innerHTML=list.slice().reverse().map(e=>`<div class="event"><div class="time">${fmtTime(e.ts)}</div><span class="signal ${levelClass(e)}"></span><div><div class="eventMain">${esc(e.title)}</div><div class="eventSub">${esc(e.detail)}</div>${e.latencyMs>=0?`<span class="latency">${esc(e.latencyMs)} ms</span>`:''}</div></div>`).join('');
              const latest=(snapshot.events||[]).slice().reverse().find(e=>e.level==='error'||e.level==='warn');
              document.getElementById('summaryTitle').textContent=latest?latest.title:(snapshot.connected?'Sistema estable':'Esperando conexión');
              document.getElementById('summaryDetail').textContent=latest?latest.detail:'La Caja Negra está registrando eventos reales de AireSmart.';
            }
            window.AireSmartBridge={refresh(data){if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return}} snapshot=data||snapshot;render()}};
            document.addEventListener('DOMContentLoaded',()=>{
              document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');filter=ch.dataset.filter;render()});
              document.getElementById('backBtn').onclick=()=>{try{AireSmartNative.close()}catch(e){history.back()}};
              document.getElementById('refreshBtn').onclick=()=>{try{AireSmartNative.refreshNow()}catch(e){}};
              document.getElementById('copyBtn').onclick=()=>{try{AireSmartNative.copyDiagnostics()}catch(e){}};
              document.getElementById('exportBtn').onclick=()=>{try{AireSmartNative.shareDiagnostics()}catch(e){}};
              document.getElementById('clearBtn').onclick=()=>{if(confirm('¿Borrar el historial de Caja Negra?')){try{AireSmartNative.clearHistory()}catch(e){}}};
              try{AireSmartNative.refreshNow()}catch(e){}
            });
          })();
          EOF

